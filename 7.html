<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سجل العمل والأماكن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #ffffff; margin: 0; padding: 20px; box-sizing: border-box; min-height: 100vh; }
    
    /* الهيدر وزر الرجوع */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
    .back-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 5px;}
    .back-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
    
    /* الكروت الزجاجية */
    .card { background: rgba(20, 30, 45, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .card h3 { margin-top: 0; color: #00d2ff; font-weight: 800; border-bottom: 1px dashed rgba(0, 210, 255, 0.3); padding-bottom: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    
    /* المدخلات والأزرار */
    input, select { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 12px; width: 100%; font-size: 15px; font-family: 'Cairo', sans-serif; border-radius: 10px; margin-bottom: 15px; outline: none; box-sizing: border-box; transition: 0.3s; }
    input:focus, select:focus { border-color: #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    
    .btn { background: linear-gradient(45deg, #11998e, #38ef7d); color: #fff; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; font-family: 'Cairo', sans-serif; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4); transition: 0.3s; margin-bottom: 10px; }
    .btn:active { transform: scale(0.95); }
    .btn-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); box-shadow: 0 5px 15px rgba(33, 147, 176, 0.4); }
    
    /* قائمة الأماكن وإدارتها */
    .locations-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 5px; margin-top: 10px; }
    .locations-list::-webkit-scrollbar { width: 5px; }
    .locations-list::-webkit-scrollbar-thumb { background: #00d2ff; border-radius: 10px; }
    .loc-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .loc-name { font-weight: bold; font-size: 15px; }
    .loc-actions { display: flex; gap: 10px; }
    .loc-actions button { background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; transition: 0.3s; }
    .loc-actions button:active { transform: scale(0.8); }

    /* ستايل التقرير المجمع */
    .location-group { background: rgba(0,0,0,0.4); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(0, 210, 255, 0.2); }
    .location-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 10px; }
    .location-title { color: #38ef7d; font-size: 18px; font-weight: bold; }
    .location-count { background: #00d2ff; color: #000; padding: 3px 12px; border-radius: 15px; font-size: 14px; font-weight: bold; box-shadow: 0 0 8px rgba(0, 210, 255, 0.5); }
    
    .date-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .date-item { background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
    .delete-btn-small { background: rgba(255, 75, 75, 0.8); color: white; border: none; border-radius: 5px; cursor: pointer; padding: 4px 6px; font-size: 10px; }
    
    /* معلومات النبطشية القادمة */
    #nextShiftInfo { background: rgba(88, 166, 255, 0.1); border: 1px solid #58a6ff; padding: 15px; border-radius: 10px; text-align: center; display: none; margin-top: 15px; }
    #nextShiftInfo span { display: block; color: #fff; font-size: 18px; font-weight: bold; margin-top: 5px; }

    /* الإشعارات */
    #custom-toast { visibility: hidden; min-width: 250px; background-color: rgba(30, 40, 55, 0.95); color: #fff; text-align: center; border-radius: 15px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 15px; font-family: 'Cairo', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); opacity: 0; transition: opacity 0.4s, bottom 0.4s; }
    #custom-toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    #custom-toast.error { background-color: rgba(255, 75, 75, 0.95); border-color: #ff4b4b; }
    #custom-toast.success { background-color: rgba(56, 239, 125, 0.95); color: #000; font-weight: bold; border-color: #11998e; }
</style>
</head>
<body>

<div id="custom-toast">رسالة النظام</div>

<div class="header">
    <h2 style="margin:0; font-size:20px; font-weight: 800;">سجل أماكن النبطشية</h2>
    <a href="index.html" class="back-btn">رجوع ↩️</a>
</div>

<!-- الكارت الأول: إدارة الأماكن -->
<div class="card">
    <h3>📍 إدارة أماكن العمل</h3>
    <div style="display: flex; gap: 10px; margin-bottom: 5px;">
        <input type="text" id="newLocation" placeholder="إضافة مكان جديد..." style="margin-bottom: 0;">
        <button class="btn btn-blue" onclick="addLocation()" style="width: auto; margin-bottom: 0; padding: 0 15px;">إضافة</button>
    </div>
    
    <!-- قائمة الأماكن هتظهر هنا -->
    <div id="locationsList" class="locations-list"></div>
</div>

<!-- الكارت الثاني: تسجيل اليومية -->
<div class="card">
    <h3>📝 تسجيل نبطشية اليوم</h3>
    <label style="font-size: 14px; color: #b0b3b8; display: block; margin-bottom: 5px;">تاريخ النبطشية:</label>
    <input type="date" id="shiftDate">
    
    <label style="font-size: 14px; color: #b0b3b8; display: block; margin-bottom: 5px;">اختر المكان:</label>
    <select id="locationSelect">
        <option value="">-- يرجى إضافة أماكن أولاً --</option>
    </select>
    
    <button class="btn" onclick="saveShift()">💾 تسجيل النبطشية</button>

    <div id="nextShiftInfo">
        موعد النبطشية القادمة (نظام 24/48):
        <span id="nextShiftDateText">--</span>
    </div>
</div>

<!-- الكارت الثالث: التقارير -->
<div class="card">
    <h3>📊 تقرير الأماكن والتاريخ</h3>
    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label style="font-size: 12px; color: #b0b3b8;">من تاريخ:</label>
            <input type="date" id="reportFrom">
        </div>
        <div style="flex: 1;">
            <label style="font-size: 12px; color: #b0b3b8;">إلى تاريخ:</label>
            <input type="date" id="reportTo">
        </div>
    </div>
    <button class="btn btn-blue" onclick="generateReport()">🔍 عرض التقرير</button>
    
    <div id="reportResults" style="margin-top: 15px;">
        <!-- نتائج التقرير المجمعة تظهر هنا -->
    </div>
</div>

<script>
    function showToast(message, type = "normal") {
        const toast = document.getElementById("custom-toast");
        toast.innerText = message;
        toast.className = type === "error" ? "error show" : (type === "success" ? "success show" : "show");
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    document.getElementById('shiftDate').valueAsDate = new Date();
    
    // جلب البيانات بدون مسح القديم
    let savedLocations = JSON.parse(localStorage.getItem('_work_locations')) || [];
    let shiftLogs = JSON.parse(localStorage.getItem('_shift_logs')) || [];

    // دالة عرض قائمة الأماكن وتحديث القائمة المنسدلة
    function renderLocations() {
        // تحديث القائمة المنسدلة
        const select = document.getElementById("locationSelect");
        if(savedLocations.length === 0) {
            select.innerHTML = '<option value="">-- يرجى إضافة أماكن أولاً --</option>';
        } else {
            select.innerHTML = '<option value="">-- اختر المكان --</option>';
            savedLocations.forEach(loc => {
                select.innerHTML += `<option value="${loc}">${loc}</option>`;
            });
        }

        // تحديث قائمة الإدارة (التعديل والحذف)
        const list = document.getElementById("locationsList");
        list.innerHTML = "";
        savedLocations.forEach((loc, index) => {
            list.innerHTML += `
                <div class="loc-item">
                    <span class="loc-name">${loc}</span>
                    <div class="loc-actions">
                        <button onclick="editLocation(${index})" title="تعديل اسم المكان">✏️</button>
                        <button onclick="deleteLocation(${index})" title="حذف المكان">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    // تشغيل العرض عند فتح الصفحة
    renderLocations();

    // إضافة مكان جديد
    function addLocation() {
        const locInput = document.getElementById("newLocation").value.trim();
        if(!locInput) { showToast("⚠️ يرجى كتابة اسم المكان!", "error"); return; }
        if(savedLocations.includes(locInput)) { showToast("⚠️ هذا المكان مضاف مسبقاً!", "error"); return; }
        
        savedLocations.push(locInput);
        localStorage.setItem('_work_locations', JSON.stringify(savedLocations));
        document.getElementById("newLocation").value = "";
        renderLocations();
        showToast("✅ تم إضافة المكان بنجاح", "success");
    }

    // تعديل اسم مكان (وتحديث السجلات القديمة المرتبطة به)
    function editLocation(index) {
        const oldName = savedLocations[index];
        const newName = prompt("أدخل الاسم الجديد للمكان:", oldName);

        if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
            if(savedLocations.includes(newName.trim())) {
                showToast("⚠️ هذا الاسم موجود مسبقاً!", "error");
                return;
            }

            // تعديل الاسم في قائمة الأماكن
            savedLocations[index] = newName.trim();
            localStorage.setItem('_work_locations', JSON.stringify(savedLocations));

            // الأهم: تعديل الاسم في جميع السجلات القديمة عشان التقرير ميبوظش
            shiftLogs.forEach(log => {
                if (log.location === oldName) {
                    log.location = newName.trim();
                }
            });
            localStorage.setItem('_shift_logs', JSON.stringify(shiftLogs));

            renderLocations();
            showToast("✅ تم التعديل بنجاح", "success");
        }
    }

    // حذف مكان من القائمة
    function deleteLocation(index) {
        const locName = savedLocations[index];
        if (confirm(`هل أنت متأكد من حذف المكان: "${locName}"؟\nملاحظة: السجلات القديمة اللي متسجلة باسمه مش هتتحذف من التقرير.`)) {
            savedLocations.splice(index, 1);
            localStorage.setItem('_work_locations', JSON.stringify(savedLocations));
            renderLocations();
            showToast("🗑️ تم حذف المكان", "success");
        }
    }

    // تسجيل النبطشية
    function saveShift() {
        const dateStr = document.getElementById("shiftDate").value;
        const location = document.getElementById("locationSelect").value;

        if(!dateStr || !location) { showToast("⚠️ يرجى تحديد التاريخ والمكان!", "error"); return; }

        let workDate = new Date(dateStr);
        let nextWorkDate = new Date(workDate);
        nextWorkDate.setDate(workDate.getDate() + 3);

        const logEntry = {
            id: Date.now(),
            workDate: dateStr,
            location: location,
            nextShift: nextWorkDate.toISOString().split('T')[0]
        };

        const existsIndex = shiftLogs.findIndex(log => log.workDate === dateStr);
        if(existsIndex !== -1) {
            shiftLogs[existsIndex] = logEntry; 
        } else {
            shiftLogs.push(logEntry);
        }

        shiftLogs.sort((a, b) => new Date(b.workDate) - new Date(a.workDate));
        localStorage.setItem('_shift_logs', JSON.stringify(shiftLogs));
        showToast("✅ تم تسجيل النبطشية بنجاح", "success");

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById("nextShiftDateText").innerText = nextWorkDate.toLocaleDateString('ar-EG', options);
        document.getElementById("nextShiftInfo").style.display = "block";
    }

    // عرض التقرير المجمّع
    function generateReport() {
        const fromDate = document.getElementById("reportFrom").value;
        const toDate = document.getElementById("reportTo").value;
        const container = document.getElementById("reportResults");
        
        container.innerHTML = "";

        if(!fromDate || !toDate) { showToast("⚠️ يرجى تحديد فترة التقرير!", "error"); return; }

        let start = new Date(fromDate);
        let end = new Date(toDate);

        let filteredLogs = shiftLogs.filter(log => {
            let logDate = new Date(log.workDate);
            return logDate >= start && logDate <= end;
        });

        if(filteredLogs.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:10px; color:#ff4b4b;">لا توجد سجلات في هذه الفترة.</div>';
            return;
        }

        let groupedLogs = {};
        filteredLogs.forEach(log => {
            if (!groupedLogs[log.location]) {
                groupedLogs[log.location] = [];
            }
            groupedLogs[log.location].push(log);
        });

        let html = "";
        const options = { month: 'short', day: 'numeric' }; 
        
        for (const location in groupedLogs) {
            const logs = groupedLogs[location];
            logs.sort((a, b) => new Date(b.workDate) - new Date(a.workDate));

            html += `
            <div class="location-group">
                <div class="location-header">
                    <span class="location-title">📍 ${location}</span>
                    <span class="location-count">العدد: ${logs.length}</span>
                </div>
                <div class="date-list">
            `;

            logs.forEach(log => {
                let displayDate = new Date(log.workDate).toLocaleDateString('ar-EG', options);
                html += `
                    <div class="date-item" id="log-${log.id}">
                        <span>📅 ${displayDate}</span>
                        <button class="delete-btn-small" onclick="deleteLog(${log.id})" title="حذف هذا اليوم">❌</button>
                    </div>
                `;
            });

            html += `
                </div>
            </div>`;
        }

        container.innerHTML = html;
        showToast(`✅ إجمالي أيام العمل: ${filteredLogs.length}`, "success");
    }

    // حذف يوم من السجل
    function deleteLog(id) {
        if(confirm("هل أنت متأكد من حذف هذا اليوم من السجل؟")) {
            shiftLogs = shiftLogs.filter(log => log.id !== id);
            localStorage.setItem('_shift_logs', JSON.stringify(shiftLogs));
            generateReport(); 
            showToast("🗑️ تم الحذف بنجاح", "success");
        }
    }
</script>

</body>
</html>
