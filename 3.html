<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام التصفيات الذكي</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --accent-color: #d29922; /* لون ذهبي */
      --selection-bg: #1f6feb; /* لون أزرق للاختيار */
      --success-color: #238636;
    }

    body {
      font-family: 'Segoe UI', 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative; /* من أجل زر الرجوع */
    }

    /* زر الرجوع للقائمة الرئيسية - جديد */
    .home-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      text-decoration: none;
      background: var(--card-bg);
      color: var(--text-muted);
      padding: 8px 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .home-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: rgba(255,255,255,0.05);
    }

    /* تعديل وضع الزر على الشاشات الصغيرة */
    @media (max-width: 400px) {
      .home-btn {
        position: static;
        margin-bottom: 15px;
        width: 100%;
        justify-content: center;
      }
    }

    /* رأس الصفحة */
    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    
    h1 {
      font-size: 28px;
      margin: 0 0 5px 0;
      background: linear-gradient(45deg, #f0b429, #f9d976);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    #datetime {
      font-size: 14px;
      color: var(--text-muted);
      font-family: monospace;
      background: rgba(255,255,255,0.05);
      padding: 5px 15px;
      border-radius: 20px;
      display: inline-block;
    }

    /* الحاوية الرئيسية */
    main {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* العناوين الداخلية */
    .section-title {
      font-size: 16px;
      color: var(--text-muted);
      margin: 15px 0 10px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* مجموعات الأزرار */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .options-grid.three-cols {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .option-btn {
      background: rgba(255,255,255,0.03);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 15px;
      font-weight: bold;
      color: var(--text-muted);
      position: relative;
      overflow: hidden;
    }

    .option-btn:hover {
      background: rgba(255,255,255,0.08);
    }

    /* عند التحديد */
    .option-btn.active {
      border-color: var(--selection-bg);
      background: rgba(31, 111, 235, 0.15);
      color: #58a6ff;
      box-shadow: 0 0 10px rgba(31, 111, 235, 0.2);
    }

    /* حقل الإدخال */
    .input-group {
      position: relative;
      margin-top: 10px;
    }
    
    input[type="number"] {
      width: 100%;
      background: #0d1117;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
      outline: none;
      transition: 0.3s;
    }

    input[type="number"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(210, 153, 34, 0.15);
    }

    /* زر الحساب */
    .calc-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color), #b08800);
      color: #000;
      border: none;
      padding: 18px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 4px 15px rgba(210, 153, 34, 0.3);
      transition: transform 0.1s;
    }

    .calc-btn:active {
      transform: scale(0.98);
    }

    /* عرض النتائج */
    #result {
      margin-top: 25px;
      background: rgba(35, 134, 54, 0.1);
      border: 1px solid rgba(35, 134, 54, 0.4);
      border-radius: 12px;
      padding: 20px;
      display: none;
      animation: slideDown 0.4s ease;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      padding-bottom: 5px;
    }

    .result-row:last-child {
      border: none;
      margin-top: 15px;
      padding-top: 5px;
      font-size: 22px;
      font-weight: bold;
      color: #3fb950;
    }

    /* قسم الحكم */
    #quotes {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .quote-box {
      background: rgba(255,255,255,0.02);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-style: italic;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- زر الرجوع للقائمة الرئيسية -->
  <a href="index.html" class="home-btn">
    🏠 القائمة الرئيسية
  </a>

  <header>
    <h1>نظام التصفيات</h1>
    <div id="datetime">--:--:--</div>
  </header>

  <main>
    <!-- نوع العملية -->
    <div class="section-title">📦 نوع العملية</div>
    <div class="options-grid" id="operationOptions">
      <div class="option-btn" data-value="export">تصدير (35)</div>
      <div class="option-btn" data-value="internal">داخلي (23.1)</div>
    </div>

    <!-- نوع المركبة (تم التعديل هنا) -->
    <div class="section-title">🚛 نوع المركبة</div>
    <div class="options-grid" id="vehicleOptions">
      <div class="option-btn" data-value="trailer">تريلا</div>
      <div class="option-btn" data-value="truck">جرار</div>
    </div>

    <!-- عدد المحاور -->
    <div class="section-title">⚙️ عدد المحاور</div>
    <div class="options-grid three-cols" id="axlesOptions">
      <div class="option-btn" data-value="5">5 محاور</div>
      <div class="option-btn" data-value="6">6 محاور</div>
      <div class="option-btn" data-value="7">7 محاور</div>
    </div>

    <!-- الوزن -->
    <div class="section-title">⚖️ الوزن القائم (طن)</div>
    <div class="input-group">
      <input type="number" id="totalWeight" placeholder="أدخل الوزن هنا..." step="0.01">
    </div>

    <!-- زر الحساب -->
    <button class="calc-btn" onclick="calculate()">احسب التكلفة 💰</button>

    <!-- النتيجة -->
    <div id="result"></div>

    <!-- الحكم -->
    <div id="quotes">
      <div class="quote-box" id="quran"></div>
      <div class="quote-box" id="bible"></div>
      <div class="quote-box" id="wisdom"></div>
    </div>
  </main>

  <script>
    // 1. التاريخ والوقت
    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('datetime').textContent = now.toLocaleString('ar-EG', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 2. تفعيل الأزرار
    function setupOptions(id) {
      const container = document.getElementById(id);
      container.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }
    setupOptions('operationOptions');
    setupOptions('vehicleOptions');
    setupOptions('axlesOptions');

    // دالة مساعدة
    function getSelectedValue(id) {
      const active = document.querySelector(`#${id} .option-btn.active`);
      return active ? active.getAttribute('data-value') : null;
    }

    // 3. الحسابات
    function calculate() {
      const operation = getSelectedValue('operationOptions');
      const vehicle = getSelectedValue('vehicleOptions');
      const axlesVal = getSelectedValue('axlesOptions');
      const axles = axlesVal ? parseInt(axlesVal) : null;
      let totalWeight = parseFloat(document.getElementById('totalWeight').value);
      const resultDiv = document.getElementById('result');

      // التحقق من المدخلات
      if (!operation || !vehicle || !axles || isNaN(totalWeight)) {
        resultDiv.style.display = "block";
        resultDiv.style.background = "rgba(218, 54, 51, 0.1)";
        resultDiv.style.borderColor = "#da3633";
        resultDiv.innerHTML = "<div style='color:#ff7b72; text-align:center;'>⛔ يرجى اختيار جميع الحقول وإدخال الوزن بشكل صحيح</div>";
        return;
      }

      // زيادة الـ 5 طن للـ 7 محاور فقط
      if (axles === 7) totalWeight += 5;

      // تحديد السعر
      let rate = (operation === 'export') ? 35 : 23.10;

      // تحديد الوزن المسموح
      let allowedWeight = 0;
      if (axles === 7) allowedWeight = 67;
      else if (axles === 6) allowedWeight = (vehicle === 'trailer') ? 57 : 60;
      else if (axles === 5) allowedWeight = (vehicle === 'trailer') ? 50 : 53;

      // حساب الزيادة
      let excess = totalWeight - allowedWeight;
      if (excess < 0) excess = 0;

      // حساب المبلغ
      let finalAmount = excess * rate;

      // عرض النتيجة
      resultDiv.style.display = "block";
      resultDiv.style.background = "rgba(35, 134, 54, 0.1)";
      resultDiv.style.borderColor = "rgba(35, 134, 54, 0.4)";
      
      resultDiv.innerHTML = `
        <div class="result-row">
          <span>الوزن المحتسب ${axles === 7 ? '(+5)' : ''}:</span>
          <span>${totalWeight.toFixed(2)} طن</span>
        </div>
        <div class="result-row">
          <span>الوزن المسموح:</span>
          <span>${allowedWeight} طن</span>
        </div>
        <div class="result-row">
          <span>الوزن الزائد:</span>
          <span style="color:#d29922">${excess.toFixed(2)} طن</span>
        </div>
        <div class="result-row">
          <span>التكلفة النهائية:</span>
          <span>${finalAmount.toFixed(2)} ج.م</span>
        </div>
      `;
    }

    // 4. الحكم والآيات
    const quranVerses = [
      "وَقُولُوا لِلنَّاسِ حُسْنًا",
      "إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ",
      "فَاسْتَبِقُوا الْخَيْرَاتِ",
      "وَأَحْسِنُوا ۛ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ"
    ];
    const bibleVerses = [
      "أَحِبُّوا بَعْضُكُمْ بَعْضًا",
      "طُوبَى لِلْوُدَعَاءِ لأَنَّهُمْ يَرِثُونَ الأَرْضَ",
      "كُلُّ مَا تُرِيدُونَ أَنْ يَفْعَلَ النَّاسُ بِكُمُ افْعَلُوا هكَذَا"
    ];
    const wisdoms = [
      "من جد وجد ومن زرع حصد",
      "الوقت كالسيف إن لم تقطعه قطعك",
      "لا تؤجل عمل اليوم إلى الغد",
      "الكلمة الطيبة صدقة"
    ];

    function setQuotes() {
      const dayIndex = new Date().getDate(); 
      document.getElementById('quran').innerHTML = "📖 " + quranVerses[dayIndex % quranVerses.length];
      document.getElementById('bible').innerHTML = "✝️ " + bibleVerses[dayIndex % bibleVerses.length];
      document.getElementById('wisdom').innerHTML = "💡 " + wisdoms[dayIndex % wisdoms.length];
    }
    setQuotes();
  </script>
</body>
</html>
