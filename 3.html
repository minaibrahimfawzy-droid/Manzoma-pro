<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام التصفيات الذكي</title>
  <!-- استدعاء خط Cairo الاحترافي -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary-color: #2563eb; /* أزرق عصري */
      --primary-hover: #1d4ed8;
      --accent-color: #f59e0b; /* برتقالي/ذهبي للتحذيرات والوزن الزائد */
      --success-bg: #ecfdf5;
      --success-color: #059669;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* زر الرجوع للقائمة الرئيسية */
    .home-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      text-decoration: none;
      background: var(--card-bg);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
      z-index: 100;
    }

    .home-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .home-btn {
        position: static;
        margin-bottom: 20px;
        width: 100%;
        justify-content: center;
        box-sizing: border-box;
      }
    }

    /* رأس الصفحة */
    header {
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
      margin-top: 20px;
    }
    
    h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
      color: var(--primary-color);
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    #datetime {
      font-size: 14px;
      color: var(--text-muted);
      background: #e2e8f0;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      font-weight: 600;
    }

    /* الحاوية الرئيسية */
    main {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      box-sizing: border-box;
    }

    /* العناوين الداخلية */
    .section-title {
      font-size: 16px;
      color: var(--text-main);
      margin: 20px 0 12px 0;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* مجموعات الأزرار */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .options-grid.three-cols {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .option-btn {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      user-select: none;
    }

    .option-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    /* عند التحديد */
    .option-btn.active {
      border-color: var(--primary-color);
      background: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transform: translateY(-2px);
    }

    /* حقل الإدخال */
    .input-group {
      position: relative;
    }
    
    input[type="number"] {
      width: 100%;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      color: var(--text-main);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      box-sizing: border-box;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Cairo', sans-serif;
    }

    input[type="number"]::placeholder {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 600;
    }

    input[type="number"]:focus {
      border-color: var(--primary-color);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* زر الحساب */
    .calc-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
      font-family: 'Cairo', sans-serif;
    }

    .calc-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }

    .calc-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    /* عرض النتائج */
    #result {
      margin-top: 25px;
      background: var(--success-bg);
      border: 2px solid #a7f3d0;
      border-radius: 16px;
      padding: 20px;
      display: none;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 12px;
      color: var(--text-main);
    }

    .result-row span:last-child {
      font-weight: 800;
    }

    .result-row:last-child {
      border: none;
      margin-bottom: 0;
      padding-bottom: 0;
      padding-top: 8px;
    }

    .final-cost {
      background: var(--success-color);
      color: white !important;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 22px !important;
    }

    .warning-text {
      color: var(--accent-color);
      font-weight: 800;
    }

    /* قسم الحكم */
    #quotes {
      margin-top: 35px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .quote-box {
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-weight: 600;
      border: 1px solid #e2e8f0;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- زر الرجوع للقائمة الرئيسية -->
  <a href="index.html" class="home-btn">
    🏠 القائمة الرئيسية
  </a>

  <header>
    <h1>نظام التصفيات</h1>
    <div id="datetime">--:--:--</div>
  </header>

  <main>
    <!-- نوع العملية -->
    <div class="section-title">📦 نوع العملية</div>
    <div class="options-grid" id="operationOptions">
      <div class="option-btn" data-value="export">تصدير (35)</div>
      <div class="option-btn" data-value="internal">داخلي (23.1)</div>
    </div>

    <!-- نوع المركبة -->
    <div class="section-title">🚛 نوع المركبة</div>
    <div class="options-grid" id="vehicleOptions">
      <div class="option-btn" data-value="trailer">تريلا</div>
      <div class="option-btn" data-value="truck">جرار</div>
    </div>

    <!-- عدد المحاور -->
    <div class="section-title">⚙️ عدد المحاور</div>
    <div class="options-grid three-cols" id="axlesOptions">
      <div class="option-btn" data-value="5">5 محاور</div>
      <div class="option-btn" data-value="6">6 محاور</div>
      <div class="option-btn" data-value="7">7 محاور</div>
    </div>

    <!-- الوزن -->
    <div class="section-title">⚖️ الوزن القائم (طن)</div>
    <div class="input-group">
      <input type="number" id="totalWeight" placeholder="أدخل الوزن هنا..." step="0.01">
    </div>

    <!-- زر الحساب -->
    <button class="calc-btn" onclick="calculate()">احسب التكلفة 💰</button>

    <!-- النتيجة -->
    <div id="result"></div>

    <!-- الحكم -->
    <div id="quotes">
      <div class="quote-box" id="quran"></div>
      <div class="quote-box" id="bible"></div>
      <div class="quote-box" id="wisdom"></div>
    </div>
  </main>

  <script>
    // 1. التاريخ والوقت
    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('datetime').textContent = now.toLocaleString('ar-EG', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 2. تفعيل الأزرار
    function setupOptions(id) {
      const container = document.getElementById(id);
      container.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }
    setupOptions('operationOptions');
    setupOptions('vehicleOptions');
    setupOptions('axlesOptions');

    // دالة مساعدة
    function getSelectedValue(id) {
      const active = document.querySelector(`#${id} .option-btn.active`);
      return active ? active.getAttribute('data-value') : null;
    }

    // 3. الحسابات
    function calculate() {
      const operation = getSelectedValue('operationOptions');
      const vehicle = getSelectedValue('vehicleOptions');
      const axlesVal = getSelectedValue('axlesOptions');
      const axles = axlesVal ? parseInt(axlesVal) : null;
      let totalWeight = parseFloat(document.getElementById('totalWeight').value);
      const resultDiv = document.getElementById('result');

      // التحقق من المدخلات
      if (!operation || !vehicle || !axles || isNaN(totalWeight)) {
        resultDiv.style.display = "block";
        resultDiv.style.background = "#fef2f2";
        resultDiv.style.borderColor = "#fecaca";
        resultDiv.innerHTML = "<div style='color:#ef4444; text-align:center; font-weight:700; font-size:16px;'>⛔ يرجى اختيار جميع الحقول وإدخال الوزن بشكل صحيح</div>";
        return;
      }

      // زيادة الـ 5 طن للـ 7 محاور فقط
      if (axles === 7) totalWeight += 5;

      // تحديد السعر
      let rate = (operation === 'export') ? 35 : 23.10;

      // تحديد الوزن المسموح
      let allowedWeight = 0;
      if (axles === 7) allowedWeight = 67;
      else if (axles === 6) allowedWeight = (vehicle === 'trailer') ? 57 : 60;
      else if (axles === 5) allowedWeight = (vehicle === 'trailer') ? 50 : 53;

      // حساب الزيادة
      let excess = totalWeight - allowedWeight;
      if (excess < 0) excess = 0;

      // حساب المبلغ
      let finalAmount = excess * rate;

      // عرض النتيجة
      resultDiv.style.display = "block";
      resultDiv.style.background = "var(--success-bg)";
      resultDiv.style.borderColor = "#a7f3d0";
      
      resultDiv.innerHTML = `
        <div class="result-row">
          <span>الوزن المحتسب ${axles === 7 ? '<span style="color:var(--primary-color)">(+5)</span>' : ''}:</span>
          <span>${totalWeight.toFixed(2)} طن</span>
        </div>
        <div class="result-row">
          <span>الوزن المسموح:</span>
          <span>${allowedWeight} طن</span>
        </div>
        <div class="result-row">
          <span>الوزن الزائد:</span>
          <span class="warning-text">${excess.toFixed(2)} طن</span>
        </div>
        <div class="result-row" style="margin-top: 15px;">
          <span style="font-size: 18px;">التكلفة النهائية:</span>
          <span class="final-cost">${finalAmount.toFixed(2)} ج.م</span>
        </div>
      `;
    }

    // 4. الحكم والآيات
    const quranVerses = [
      "وَقُولُوا لِلنَّاسِ حُسْنًا",
      "إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ",
      "فَاسْتَبِقُوا الْخَيْرَاتِ",
      "وَأَحْسِنُوا ۛ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ"
    ];
    const bibleVerses = [
      "أَحِبُّوا بَعْضُكُمْ بَعْضًا",
      "طُوبَى لِلْوُدَعَاءِ لأَنَّهُمْ يَرِثُونَ الأَرْضَ",
      "كُلُّ مَا تُرِيدُونَ أَنْ يَفْعَلَ النَّاسُ بِكُمُ افْعَلُوا هكَذَا"
    ];
    const wisdoms = [
      "من جد وجد ومن زرع حصد",
      "الوقت كالسيف إن لم تقطعه قطعك",
      "لا تؤجل عمل اليوم إلى الغد",
      "الكلمة الطيبة صدقة"
    ];

    function setQuotes() {
      const dayIndex = new Date().getDate(); 
      document.getElementById('quran').innerHTML = "📖 " + quranVerses[dayIndex % quranVerses.length];
      document.getElementById('bible').innerHTML = "✝️ " + bibleVerses[dayIndex % bibleVerses.length];
      document.getElementById('wisdom').innerHTML = "💡 " + wisdoms[dayIndex % wisdoms.length];
    }
    setQuotes();
  </script>
</body>
</html>
