<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهيئات ومواسير</title>
<style>
body{margin:0;padding:0;font-family:'Cairo',sans-serif;background:#000;color:gold;text-align:center;padding-bottom:50px;}
h1{margin:20px 0;font-size:2.2em;font-weight:900;color:gold;text-shadow:0 0 15px #ffd700;}
h2{color:#fff; border-bottom: 2px solid gold; display:inline-block; padding-bottom:5px; margin-bottom: 20px;}
#datetime{font-weight:900;color:#ffd700;margin-bottom:20px;font-size:1em;}

/* الحقول */
input{padding:12px;margin:8px 0;width:85%;font-size:1.1em;border-radius:12px;border:2px solid gold;background:#111;color:gold;text-align:center;font-weight:900;}

/* الأزرار العامة */
button{padding:14px 15px;margin:8px 4px;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:1.1em; transition:0.3s; min-width: 60px;}
button:active{transform:scale(0.95);}

/* ألوان الأزرار */
.btn-gold{background:gold;color:black;}
.btn-reset{background:#b8860b;color:white;}
.btn-add{background:#00c853;color:white; box-shadow: 0 0 10px #00c853;} /* زر الجمع الأخضر */
.btn-clear-all{background:#d50000;color:white; width:85%; margin-top:15px;} /* زر تصفير العداد */
.btn-menu{background: linear-gradient(45deg, #ffd700, #b8860b); color: black; width: 85%; margin: 10px auto; display: block; padding: 20px; font-size: 1.5em; box-shadow: 0 0 15px gold;}
.btn-back{background: #333; color: #fff; border: 1px solid gold; font-size: 0.9em; padding: 10px 15px;}

/* النتائج */
.result-box{border:2px solid gold;border-radius:14px;padding:15px;width:85%;margin:15px auto;font-size:1.4em;font-weight:900;background:linear-gradient(180deg,#222,#000);color:white;box-shadow:0 0 25px rgba(255,215,0,0.6);}
.shine{animation:shine 1.5s linear infinite;color:gold;}
@keyframes shine{0%{box-shadow:0 0 15px gold;}50%{box-shadow:0 0 35px gold;}100%{box-shadow:0 0 15px gold;}}

.total-box{border:3px dashed #00c853; border-radius:14px; padding:15px; width:85%; margin:20px auto; font-size:1.6em; font-weight:900; background:#0a200a; color:#00e676;}

.hidden {display: none;}
</style>
</head>
<body>

<!-- زر الرجوع للقائمة الرئيسية (تمت الإضافة) -->
<button onclick="window.location.href='index.html'" style="width: auto; padding: 10px 20px; margin: 10px auto; background: #333; color: gold; border: 2px solid gold; border-radius: 12px; font-weight: bold; display: block;">🏠 القائمة الرئيسية</button>

<!-- تم تغيير الاسم هنا -->
<h1>🛠️ مهيئات ومواسير</h1>
<div id="datetime"></div>

<!-- تم إزالة شاشة الدخول -->

<!-- القائمة الرئيسية (تظهر مباشرة الآن) -->
<div id="menuSection">
    <h2>القائمة الرئيسية</h2>
    <button class="btn-menu" onclick="showApp('boxApp')">📦 المهيئ</button>
    <button class="btn-menu" onclick="showApp('pipeApp')">🔧 المواسير</button>
</div>

<!-- ============ برنامج المهيئ ============ -->
<div id="boxApp" class="hidden">
    <h2>حساب المهيئ</h2>
    <input type="number" id="length" placeholder="الطول (متر)">
    <input type="number" id="width" placeholder="العرض (متر)">
    <input type="number" id="height" placeholder="الارتفاع (متر)">
    <br>
    <!-- أزرار العمليات -->
    <button id="calcBox" class="btn-gold">احسب</button>
    <button id="addBoxToTotal" class="btn-add" title="أضف للمجموع">+</button>
    <button id="resetBox" class="btn-reset">مسح</button>
    
    <div id="resultsBox"></div>

    <!-- الصندوق التراكمي -->
    <div id="boxTotalSection" class="hidden">
        <div class="total-box" id="boxGrandTotal">المجموع: 0</div>
        <button onclick="clearBoxTotal()" class="btn-clear-all">بدء حساب جديد (تصفير)</button>
    </div>
    
    <br><br>
    <button onclick="goBack()" class="btn-back">رجوع للقائمة</button>
</div>

<!-- ============ برنامج المواسير ============ -->
<div id="pipeApp" class="hidden">
    <h2>حساب المواسير</h2>
    <input type="number" id="pLength" placeholder="الطول (متر)">
    <input type="number" id="pDiameter" placeholder="القطر">
    <input type="number" id="pCount" placeholder="العدد">
    <br>
    <!-- أزرار العمليات -->
    <button id="calcPipe" class="btn-gold">احسب</button>
    <button id="addPipeToTotal" class="btn-add" title="أضف للمجموع">+</button>
    <button id="resetPipe" class="btn-reset">مسح</button>

    <div id="resultsPipe"></div>

    <!-- الصندوق التراكمي -->
    <div id="pipeTotalSection" class="hidden">
        <div class="total-box" id="pipeGrandTotal">المجموع: 0</div>
        <button onclick="clearPipeTotal()" class="btn-clear-all">بدء حساب جديد (تصفير)</button>
    </div>

    <br><br>
    <button onclick="goBack()" class="btn-back">رجوع للقائمة</button>
</div>

<script>
// الوقت
function updateDateTime(){
  const now=new Date();
  const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  document.getElementById('datetime').innerText=days[now.getDay()]+' - '+now.toLocaleDateString()+' - '+now.toLocaleTimeString();
}
setInterval(updateDateTime,1000);
updateDateTime();

// تم إزالة دالة التحقق من كلمة المرور

// التنقل
function showApp(appId){
    document.getElementById('menuSection').classList.add('hidden');
    document.getElementById(appId).classList.remove('hidden');
}
function goBack(){
    document.getElementById('boxApp').classList.add('hidden');
    document.getElementById('pipeApp').classList.add('hidden');
    document.getElementById('menuSection').classList.remove('hidden');
}

// إنشاء مربع نتيجة
function createResultBox(text, isShine){
    const box=document.createElement('div');
    box.className='result-box';
    box.innerText=text;
    if(isShine) box.classList.add('shine'); 
    return box;
}

// ============================================
// منطق المهيئ
// ============================================
let currentBoxHighestValue = 0; 
let totalBoxAccumulated = 0;

function calculateBox(){
    const L=parseFloat(document.getElementById('length').value)||0;
    const W=parseFloat(document.getElementById('width').value)||0;
    const H=parseFloat(document.getElementById('height').value)||0;
    
    // القيم القياسية
    const stdL=12,stdW=2.4,stdH=2;

    // 1. حساب الأساسي
    const base=L*W*H*100;
    
    // 2. حساب البروز
    let burooz=0;
    let buroozText=[];
    if(L>stdL){burooz+=(L-stdL)*stdW*500;buroozText.push('بروز طولي: '+(L-stdL).toFixed(2)+' م');}
    if(W>stdW){burooz+=(W-stdW)*L*500;buroozText.push('بروز عرضي: '+(W-stdW).toFixed(2)+' م');}
    if(H>stdH){burooz+=(H-stdH)*L*500;buroozText.push('بروز ارتفاعي: '+(H-stdH).toFixed(2)+' م');}

    const resultsDiv=document.getElementById('resultsBox');
    resultsDiv.innerHTML=''; 

    // تحديد القيمة الأكبر للجمع
    if(burooz > base && burooz > 0) {
        currentBoxHighestValue = burooz;
    } else {
        currentBoxHighestValue = base;
    }

    // عرض النتيجة الأساسية
    let baseBox=createResultBox('ناتج الحجم الأساسي: '+base.toLocaleString()+' جنيه', base>=burooz && base>0);
    resultsDiv.appendChild(baseBox);

    // عرض نتيجة البروز لو وجد
    if(burooz > 0 || buroozText.length > 0) {
        let buroozBox=createResultBox('قيمة البروز: '+burooz.toLocaleString()+' جنيه', burooz>base);
        resultsDiv.appendChild(buroozBox);
        
        // تفاصيل البروز
        if(buroozText.length > 0){
            let detailBox = createResultBox(buroozText.join(' + '), false);
            resultsDiv.appendChild(detailBox);
        }
    }
}

// زر (+) للمهيئ
document.getElementById('addBoxToTotal').onclick = function() {
    if(currentBoxHighestValue > 0) {
        totalBoxAccumulated += currentBoxHighestValue;
        document.getElementById('boxTotalSection').classList.remove('hidden');
        document.getElementById('boxGrandTotal').innerText = 'المجموع الكلي: ' + totalBoxAccumulated.toLocaleString();
        
        // مسح الحقول للكتابة السريعة
        document.getElementById('length').value='';
        document.getElementById('width').value='';
        document.getElementById('height').value='';
        document.getElementById('resultsBox').innerHTML='<div style="color:#00c853;font-weight:bold;">✅ تمت إضافة القيمة ('+currentBoxHighestValue.toLocaleString()+') للمجموع</div>';
        currentBoxHighestValue = 0;
        document.getElementById('length').focus();
    } else {
        alert("قم بالحساب أولاً");
    }
};

// زر تصفير العداد للمهيئ
function clearBoxTotal() {
    if(confirm("هل أنت متأكد من بدء حساب جديد وتصفير العداد؟")){
        totalBoxAccumulated = 0;
        currentBoxHighestValue = 0;
        document.getElementById('boxGrandTotal').innerText = 'المجموع الكلي: 0';
        document.getElementById('boxTotalSection').classList.add('hidden');
        document.getElementById('resultsBox').innerHTML='';
    }
}

document.getElementById('calcBox').onclick=calculateBox;
document.getElementById('resetBox').onclick=function(){
    document.getElementById('length').value='';
    document.getElementById('width').value='';
    document.getElementById('height').value='';
    document.getElementById('resultsBox').innerHTML='';
    currentBoxHighestValue = 0;
};


// ============================================
// منطق المواسير (Pipe)
// ============================================
let currentPipeValue = 0;
let totalPipeAccumulated = 0;

function calculatePipes(){
    const L = parseFloat(document.getElementById('pLength').value) || 0;
    const D = parseFloat(document.getElementById('pDiameter').value) || 0;
    const C = parseFloat(document.getElementById('pCount').value) || 0;

    const val = L * D * C * 100;
    currentPipeValue = val;

    const resultsDiv = document.getElementById('resultsPipe');
    resultsDiv.innerHTML = '';
    
    if(val > 0){
        resultsDiv.appendChild(createResultBox('القيمة: ' + val.toLocaleString() + ' جنيه', true));
    } else {
        resultsDiv.innerText = "تأكد من الأرقام";
    }
}

// زر (+) للمواسير
document.getElementById('addPipeToTotal').onclick = function() {
    if(currentPipeValue > 0) {
        totalPipeAccumulated += currentPipeValue;
        document.getElementById('pipeTotalSection').classList.remove('hidden');
        document.getElementById('pipeGrandTotal').innerText = 'المجموع الكلي: ' + totalPipeAccumulated.toLocaleString();

        // مسح الحقول
        document.getElementById('pLength').value='';
        document.getElementById('pDiameter').value='';
        document.getElementById('pCount').value='';
        document.getElementById('resultsPipe').innerHTML='<div style="color:#00c853;font-weight:bold;">✅ تمت الإضافة للمجموع</div>';
        currentPipeValue = 0;
        document.getElementById('pLength').focus();
    } else {
        alert("قم بحساب قيمة أولاً");
    }
};

// زر تصفير العداد للمواسير
function clearPipeTotal() {
    if(confirm("هل أنت متأكد من تصفير العداد؟")){
        totalPipeAccumulated = 0;
        currentPipeValue = 0;
        document.getElementById('pipeGrandTotal').innerText = 'المجموع الكلي: 0';
        document.getElementById('pipeTotalSection').classList.add('hidden');
        document.getElementById('resultsPipe').innerHTML='';
    }
}

document.getElementById('calcPipe').onclick=calculatePipes;
document.getElementById('resetPipe').onclick=function(){
    document.getElementById('pLength').value='';
    document.getElementById('pDiameter').value='';
    document.getElementById('pCount').value='';
    document.getElementById('resultsPipe').innerHTML='';
    currentPipeValue = 0;
};

</script>
</body>
</html>
