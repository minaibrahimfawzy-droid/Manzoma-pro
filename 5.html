<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التدفق العام - النسخة الكاملة والمطورة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f1f2f6, #dfe4ea);
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
      text-align: center;
      padding: 40px 10px;
      font-size: 22px; color: #2c3e50;
      direction: rtl;
    }
    input, button {
      background: white; border: 1px solid #ddd;
      padding: 15px; font-size: 22px; color: #2c3e50;
      width: 90%; max-width: 300px; border-radius: 8px;
      margin: 10px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.3s;
    }
    input[type="number"] { text-align: center; }
    button {
      background: linear-gradient(to right, #2ed573, #1e90ff);
      color: white; border: none; font-weight: bold; cursor: pointer;
    }
    button:hover { background: linear-gradient(to right, #218838, #0056b3); transform: translateY(-2px); }
    .result {
      margin-top: 30px; background-color: white; padding: 25px;
      border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      font-size: 22px; color: #2c3e50; text-align: right; border: 1px solid #ced6e0;
    }
    .count { color: #3742fa; font-weight: bold; font-size: 26px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #a4b0be; background-color: #f1f2f6; }
    input[type="checkbox"] { width: 25px; height: 25px; cursor: pointer; }
  </style>
</head>
<body>

<button onclick="window.location.href='index.html'" style="background: linear-gradient(to right, #7f8c8d, #2c3e50); width: auto; padding: 10px 30px; margin-bottom: 20px;">🏠 القائمة الرئيسية</button>

<div id="topBanner" style="margin-bottom: 20px;">
  <p id="datetime" style="font-weight: bold; color: #2f3542; font-size: 22px;"></p>
</div>

<h1>🌊 التدفق العام 🌊</h1>
<input type="number" id="amount" placeholder="ادخل المبلغ بالجنيه" min="0">

<div id="factions" style="margin-top:15px; text-align:right; font-size: 20px;">
  <table>
    <thead>
      <tr style="background:#dfe6e9;">
        <th>اختيار</th>
        <th>الفئة</th>
        <th>النسبة % (اختياري)</th>
      </tr>
      <tr style="background:#f9f9f9;">
        <td><input type="checkbox" onclick="toggleAll(source=this)" checked></td>
        <td colspan="2"><b>تحديد/إلغاء الكل</b></td>
      </tr>
    </thead>
    <tbody>
      <tr><td><input type="checkbox" class="faction" value="10" checked></td><td>فئة 10</td><td><input type="number" id="percent_10" min="0" max="100" placeholder="%"></td></tr>
      <tr><td><input type="checkbox" class="faction" value="15" checked></td><td>فئة 15</td><td><input type="number" id="percent_15" min="0" max="100" placeholder="%"></td></tr>
      <tr><td><input type="checkbox" class="faction" value="20" checked></td><td>فئة 20</td><td><input type="number" id="percent_20" min="0" max="100" placeholder="%"></td></tr>
      <tr><td><input type="checkbox" class="faction" value="25" checked></td><td>فئة 25</td><td><input type="number" id="percent_25" min="0" max="100" placeholder="%"></td></tr>
      <tr><td><input type="checkbox" class="faction" value="30" checked></td><td>فئة 30</td><td><input type="number" id="percent_30" min="0" max="100" placeholder="%"></td></tr>
      <tr><td><input type="checkbox" class="faction" value="35" checked></td><td>فئة 35</td><td><input type="number" id="percent_35" min="0" max="100" placeholder="%"></td></tr>
      <tr style="background-color: #e3f2fd;"><td><input type="checkbox" class="faction" value="50" checked></td><td><b>فئة 50</b></td><td><input type="number" id="percent_50" min="0" max="100" placeholder="%"></td></tr>
    </tbody>
  </table>
</div>

<button onclick="احسب()">احسب التوزيع</button>
<button onclick="location.reload()" style="background: linear-gradient(to right, #ff6b6b, #ee5253);">🔄 مسح وإعادة</button>
<div class="result" id="result"></div>

<div id="footer" style="margin-top: 40px;">
  <p id="quran" style="font-weight:bold; font-size: 20px; color: #006400;"></p>
  <p id="bible" style="font-weight:bold; font-size: 20px; color: #003366;"></p>
  <p id="wisdom" style="font-style: italic; font-size: 18px; margin-top:10px;"></p>
</div>

<script>
// --- فحص الحظر المتطور ---
const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
const CHAT_ID = "-1003886528114";
const deviceID = localStorage.getItem("_u_id");

async function checkRemoteBan() {
    try {
        const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChat?chat_id=${CHAT_ID}`);
        const d = await r.json();
        if (d.ok && d.result.description) {
            let cleanDesc = d.result.description.replace(/\s/g, ''); 
            if (cleanDesc.includes("BAN:ALL") || cleanDesc.includes("BAN:" + deviceID)) {
                localStorage.clear();
                document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>⛔ تم حظر الوصول</h1>";
                return true;
            }
        }
    } catch (e) {}
    return false;
}

function toggleAll(source) {
  let checkboxes = document.querySelectorAll(".faction");
  checkboxes.forEach(cb => cb.checked = source.checked);
}

function احسب() {
  let المبلغ = parseInt(document.getElementById("amount").value);
  let resDiv = document.getElementById("result");
  
  if (isNaN(المبلغ) || المبلغ <= 0) {
    resDiv.innerHTML = "<p style='color:red;'>⚠️ من فضلك أدخل مبلغ صحيح.</p>";
    return;
  }

  let selectedFactions = Array.from(document.querySelectorAll(".faction:checked"))
                              .map(cb => parseInt(cb.value))
                              .sort((a, b) => b - a);

  if (selectedFactions.length === 0) {
    resDiv.innerHTML = "<p style='color:red;'>⚠️ لم يتم اختيار أي فئة.</p>";
    return;
  }

  let توزيع = {}, باقي = المبلغ, مجموع_مخصص = 0, فئات_مخصصة = [], فئات_افتراضية = [];

  // تصنيف الفئات (بنسبة أو بدون)
  selectedFactions.forEach(فئة => {
    let p = document.getElementById("percent_" + فئة).value;
    if (p !== "") {
      let نسبة = parseFloat(p) / 100;
      مجموع_مخصص += نسبة;
      فئات_مخصصة.push({فئة, نسبة});
    } else {
      فئات_افتراضية.push(فئة);
    }
  });

  if (مجموع_مخصص > 1) {
    resDiv.innerHTML = "<p style='color:red;'>❌ مجموع النسب أكبر من 100%</p>";
    return;
  }

  // 1. توزيع النسب المخصصة
  فئات_مخصصة.forEach(item => {
    let عدد = Math.floor((المبلغ * item.نسبة) / item.فئة);
    توزيع[item.فئة] = عدد;
    باقي -= عدد * item.فئة;
  });

  // 2. توزيع الباقي على الفئات الافتراضية
  if (فئات_افتراضية.length > 0) {
    let نسبة_متبقية = (1 - مجموع_مخصص) / فئات_افتراضية.length;
    فئات_افتراضية.forEach(فئة => {
      let عدد = Math.floor((المبلغ * نسبة_متبقية) / فئة);
      توزيع[فئة] = عدد;
      باقي -= عدد * فئة;
    });
  }

  // 3. حل مشكلة الباقي النهائي (لتصفير المبلغ تماماً)
  selectedFactions.forEach(فئة => {
    if (باقي >= فئة) {
      let إضافي = Math.floor(باقي / فئة);
      توزيع[فئة] = (توزيع[فئة] || 0) + إضافي;
      باقي -= إضافي * فئة;
    }
  });

  // --- عرض النتائج بنفس شكل ملف الـ 14 كيلو تماماً ---
  let html = "", الإجمالي_الموزع = 0;
  selectedFactions.forEach(فئة => {
    let عدد = توزيع[فئة] || 0;
    if (عدد > 0) {
      html += `<div style="border-bottom:1px solid #eee; padding:10px 0;">`;
      html += `<p style="margin:5px 0;"><span class="count">${عدد}</span> × فئة ${فئة} = <b>${عدد * فئة}</b> جنيه</p>`;

      // استعادة كل النصوص التفصيلية القديمة
      if (فئة == 10) {
        let m = Math.floor(عدد * 0.5), n = Math.floor(عدد * 0.2), micro = عدد - m - n;
        html += `<ul style='margin-right:20px; font-size:18px; color:#555; list-style-type:none;'><li>🚗 ملاكي: ${m}</li><li>🚚 نقل ربع: ${n}</li><li>🚐 ميكروباص: ${micro}</li></ul>`;
      } else if (فئة == 15) {
        let s = Math.floor(عدد * 0.15), r = Math.floor(عدد * 0.30), mi = Math.floor(عدد * 0.05), micro = عدد-s-r-mi;
        html += `<ul style='margin-right:20px; font-size:18px; color:#555; list-style-type:none;'><li>🚙 شفر: ${s}</li><li>🚚 ربع نقل: ${r}</li><li>🚌 ميني باص: ${mi}</li><li>🚐 ميكروباص: ${micro}</li></ul>`;
      } else if (فئة == 20) {
        let s = Math.floor(عدد * 0.95), mi = عدد - s;
        html += `<ul style='margin-right:20px; font-size:18px; color:#555; list-style-type:none;'><li>🚙 شفر: ${s}</li><li>🚌 ميني باص: ${mi}</li></ul>`;
      } else if (فئة == 25) { html += `<span style="color:#777; font-size:18px;"> 🚌 أتوبيس / رحلات</span>`; }
      else if (فئة == 30) { html += `<span style="color:#777; font-size:18px;"> 🚐 نقل فردي</span>`; }
      else if (فئة == 35) { html += `<span style="color:#777; font-size:18px;"> 🚛 نقل ثقيل</span>`; }
      else if (فئة == 50) { html += `<span style="color:#777; font-size:18px;"> 🚛 تريلا / مقطورة</span>`; }

      html += `</div>`;
      الإجمالي_الموزع += (عدد * فئة);
    }
  });

  html += `<div style="margin-top:20px; padding:10px; background:#f1f2f6; border-radius:10px;">
            <p><strong>الإجمالي الموزع: ${الإجمالي_الموزع} جنيه</strong></p>
            <p><strong>إجمالي عدد التذاكر: ${Object.values(توزيع).reduce((a,b)=>a+b,0)}</strong></p>
           </div>`;

  if (باقي > 0) { html += `<p style="color:red; font-weight:bold;">المتبقي بدون توزيع (فكة): ${باقي} جنيه</p>`; }

  resDiv.innerHTML = html;
}

function updateDateTimeAndWisdom() {
  const now = new Date();
  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  document.getElementById("datetime").innerText = `${days[now.getDay()]} - ${now.toLocaleDateString()} - ${now.toLocaleTimeString()}`;
  const quran = ['﴿ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ ﴾', '﴿ وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ ﴾', '﴿ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا ﴾', '﴿ وَأَطِيعُوا اللَّهَ وَرَسُولَهُ ﴾', '﴿ وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ ﴾', '﴿ وَاخْفِضْ جَنَاحَكَ لِلْمُؤْمِنِينَ ﴾', '﴿ إِنَّهُ لَا يُحِبُّ الْمُسْتَكْبِرِينَ ﴾'];
  const bible = ['الله محبة...', 'اهربوا من الزنا', 'اغفروا يغفر لكم', 'أطيعوا مرشديكم', 'لا تسرق', 'تعلموا مني...', 'كل من يرفع نفسه يتضع'];
  const wisdom = ['المحبة تغلب كل شيء', 'الزنا مفتاح الخراب', 'من سامح ارتاح', 'الطاعة شيمة العقلاء', 'السارق نهايته ندم', 'الوداعة قوة داخلية', 'التواضع يرفعك'];
  document.getElementById("quran").innerText = quran[now.getDay()];
  document.getElementById("bible").innerText = bible[now.getDay()];
  document.getElementById("wisdom").innerText = wisdom[now.getDay()];
}

window.onload = async () => {
  if (!(await checkRemoteBan())) {
      updateDateTimeAndWisdom();
      setInterval(updateDateTimeAndWisdom, 1000);
  }
};
</script>
</body>
</html>
