<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System 2026 Loader</title>
<style>
    body {
        background-color: #0d1117;
        color: #c9d1d9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        user-select: none;
    }
    .loader-container {
        text-align: center;
        padding: 20px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 85%;
        max-width: 320px;
    }
    .loader {
        border: 4px solid #30363d;
        border-top: 4px solid #238636;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
    }
    .status-text {
        font-size: 13px;
        color: #8b949e;
        margin-bottom: 10px;
    }
    .progress-bar {
        width: 100%;
        background-color: #30363d;
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
        margin-top: 10px;
        display: none;
    }
    .progress-fill {
        height: 100%;
        background-color: #238636;
        width: 0%;
        transition: width 0.3s;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body oncontextmenu="return false">

    <div class="loader-container">
        <div class="loader" id="spinner"></div>
        <h3 style="margin:0 0 10px 0; color:#fff">نظام 2026</h3>
        <div class="status-text" id="status">جاري الاتصال...</div>
        <div class="progress-bar" id="pBar"><div class="progress-fill" id="pFill"></div></div>
        <div class="error-msg" id="errorBox"></div>
    </div>

<script>
    // ============================================================
    // 1. الإعدادات
    // ============================================================
    const REPO_URL = "https://raw.githubusercontent.com/minaibrahimfawzy-droid/Manzoma-pro/main/";
    
    // قائمة الملفات
    const APP_FILES = [
        "home.html", 
        "Nabatshia.html", 
        "2.html", 
        "3.html", 
        "4.html", 
        "5.html", 
        "6.html"
    ];

    // ============================================================
    // 2. كود الزر (HTML صريح) - هيتحط في الصفحات الفرعية فقط
    // ============================================================
    const HOME_BUTTON_HTML = `
        <div onclick="window.go('home.html')" 
             style="position:fixed; bottom:20px; left:20px; width:60px; height:60px; 
             background:#238636; color:white; border-radius:50%; 
             text-align:center; line-height:60px; font-size:30px; 
             box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index:2147483647 !important; 
             cursor:pointer; border: 3px solid #fff; display:block;">
             🏠
        </div>
    `;

    // ============================================================
    // 3. كود الجافاسكريبت (للتنقل وزر الموبايل) - هيتحط في كل الصفحات
    // ============================================================
    const LOGIC_SCRIPT = `
    <script>
        window.go = function(pageName) {
            // لو رايحين للرئيسية
            if(pageName === "index.html" || pageName === "home.html") {
                pageName = "home.html";
                // مسح الهيستوري عشان زر الموبايل يخرج لو ضغطت رجوع في الرئيسية
                history.replaceState(null, null, " ");
            } else {
                // لو رايحين لصفحة فرعية، ضيف خطوة للهيستوري عشان زر الرجوع يشتغل
                history.pushState({p: pageName}, null, "#"+pageName);
            }

            const storedPage = localStorage.getItem("sys_file_" + pageName);
            if(storedPage) {
                document.open();
                document.write(storedPage);
                document.close();
            } else {
                // لو الصفحة مش موجودة ارجع للرئيسية
                window.go("home.html");
            }
        };

        // التقاط زر الرجوع الخاص بالموبايل
        window.onpopstate = function(event) {
            // أي رجوع هيرميك على الرئيسية
            window.go("home.html");
        };

        document.oncontextmenu = function(){return false;};
    <\/script>
    `;

    // ============================================================
    // 4. دالة التحميل والتشغيل
    // ============================================================
    const uiStatus = document.getElementById("status");
    const uiPBar = document.getElementById("pBar");
    const uiPFill = document.getElementById("pFill");

    async function bootSystem() {
        
        // !!! تنظيف إجباري للنسخة القديمة لضمان ظهور الزر !!!
        // (السطر ده هيمسح الكاش عشان ينزل الملفات الجديدة اللي فيها الزر)
        if(!sessionStorage.getItem("cleaned_once")) {
            localStorage.removeItem("sys_version");
            sessionStorage.setItem("cleaned_once", "true");
        }

        let localVer = parseFloat(localStorage.getItem("sys_version")) || 0;

        if (navigator.onLine) {
            uiStatus.innerText = "فحص التحديثات...";
            try {
                // إضافة timestamp لمنع الكاش من السيرفر
                const vResponse = await fetch(REPO_URL + "version.json?t=" + Date.now());
                if (vResponse.ok) {
                    const vData = await vResponse.json();
                    const remoteVer = parseFloat(vData.version);

                    // لو فيه تحديث أو لو النسخة ممسوحة
                    if (remoteVer > localVer || localVer === 0) {
                        uiStatus.innerText = `تحديث النظام...`;
                        uiPBar.style.display = "block";
                        
                        let count = 0;
                        for (const fileName of APP_FILES) {
                            count++;
                            uiStatus.innerText = `جاري تجهيز: ${fileName}`;
                            uiPFill.style.width = Math.round((count / APP_FILES.length) * 100) + "%";
                            
                            const fResponse = await fetch(REPO_URL + fileName + "?t=" + Date.now());
                            if (!fResponse.ok) throw new Error("فشل تحميل: " + fileName);
                            
                            let content = await fResponse.text();

                            // === هنا السحر: دمج الكود داخل الملف ===
                            
                            // 1. إضافة كود الجافاسكريبت (Logic) للكل
                            if(content.includes("</body>")) {
                                content = content.replace("</body>", LOGIC_SCRIPT + "</body>");
                            } else {
                                content += LOGIC_SCRIPT;
                            }

                            // 2. إضافة "زر الرجوع" للصفحات الفرعية فقط (أي صفحة غير home.html)
                            if (fileName !== "home.html") {
                                // بنحط الزر في آخر الصفحة عشان يظهر فوق الكل
                                if(content.includes("</body>")) {
                                    content = content.replace("</body>", HOME_BUTTON_HTML + "</body>");
                                } else {
                                    content += HOME_BUTTON_HTML;
                                }
                            }

                            localStorage.setItem("sys_file_" + fileName, content);
                        }
                        
                        localStorage.setItem("sys_version", remoteVer);
                        uiStatus.innerText = "✅ تم التحديث بنجاح!";
                        await new Promise(r => setTimeout(r, 800));
                    }
                }
            } catch (err) {
                console.log("Error", err);
                uiStatus.innerText = "لا يوجد اتصال بالإنترنت...";
            }
        }

        // التشغيل
        setTimeout(() => {
            const startPage = localStorage.getItem("sys_file_home.html");

            if (startPage) {
                document.open();
                document.write(startPage);
                document.close();
            } else {
                uiStatus.innerHTML = "<span style='color:red'>خطأ: يرجى الاتصال بالإنترنت لأول مرة</span>";
            }
        }, 1000);
    }

    bootSystem();
</script>
</body>
</html>
