<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login 2026</title>
    <style>
        body {
            background-color: #121212;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border: 2px solid #0f0;
            border-radius: 10px;
            box-shadow: 0 0 15px #0f0;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #0f0;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 90%;
            padding: 10px;
            background: #0f0;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .info {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        #app-menu { display: none; }
        #errMsg { color: red; display: none; margin-top: 10px; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #0f0; width: 20px; height: 20px; -webkit-animation: spin 2s linear infinite; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- شاشة القفل -->
    <div id="lock-screen" class="container">
        <h2>🔐 تسجيل الدخول</h2>
        <p>مرحباً: <span id="dispName" style="color:white">...</span></p>
        
        <input type="password" id="pIn" placeholder="أدخل كود التفعيل">
        <br>
        <button id="loginBtn">
            <span id="btnTxt">دخول للنظام</span>
            <div id="ldr" class="loader"></div>
        </button>
        <div id="errMsg">⚠️ الكود غير صحيح!</div>

        <div class="info">
            <p>ID: <span id="dispID">جاري التحميل...</span></p>
            <p id="dispIP">IP: جاري الاتصال...</p>
            <p id="statusMsg" style="color: yellow; font-size: 10px;"></p>
        </div>
        <!-- زر خفي للتجربة اليدوية لو حصلت مشكلة -->
        <button onclick="testConnection()" style="background:transparent; border:1px solid #333; color:#555; font-size:10px; margin-top:20px;">Test Bot Connection</button>
    </div>

    <!-- شاشة التطبيق بعد الفتح -->
    <div id="app-menu" class="container">
        <h2>✅ تم الفتح بنجاح</h2>
        <p>مرحباً بك في لوحة التحكم</p>
        <hr>
        <button onclick="alert('زر تجريبي')">📂 الملفات</button>
        <br><br>
        <button onclick="logout()" style="background:red; color:white">تسجيل خروج</button>
    </div>

<script>
    // =========================================================
    // ⚙️ إعدادات البوت - تأكدنا منها 100%
    // =========================================================
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw"; 
    const CHAT_ID = "-1003886528114"; 

    // مفتاح تخزين جديد عشان ينسف القديم
    const STORAGE_KEY_NAME = "sys_FORCE_NAME_V79"; 
    const STORAGE_KEY_ID = "sys_ID_FIXED_V79";   
    
    let uName = localStorage.getItem(STORAGE_KEY_NAME);
    let uID = localStorage.getItem(STORAGE_KEY_ID);
    
    // إنشاء ID لو مش موجود
    if(!uID) {
        uID = "ID-" + Math.floor(Math.random() * 899999 + 100000);
        localStorage.setItem(STORAGE_KEY_ID, uID);
    }
    document.getElementById("dispID").innerText = uID;

    // =========================================================
    // 1. دالة الإرسال للتليجرام (معدلة لتكون قوية جداً)
    // =========================================================
    function sendToTelegram(title, details, ipAddress) {
        const ip = ipAddress || "غير متوفر/مجهول";
        
        const messageText = `
🚨 *SYSTEM ALERT (V79)*
━━━━━━━━━━━━━━
👤 *User:* ${uName}
🆔 *ID:* \`${uID}\`
🌐 *IP:* \`${ip}\`
━━━━━━━━━━━━━━
🔔 *Action:* ${title}
📄 *Details:* ${details}
        `;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(messageText)}&parse_mode=Markdown`;

        // محاولة الإرسال
        fetch(url)
            .then(res => {
                if(res.ok) {
                    console.log("تم الإرسال للتليجرام بنجاح");
                    document.getElementById("statusMsg").innerText = "Server: Connected ✅";
                } else {
                    console.error("خطأ في رد تليجرام");
                    document.getElementById("statusMsg").innerText = "Server: Error ❌";
                }
            })
            .catch(err => {
                console.error("فشل الاتصال بتليجرام:", err);
                document.getElementById("statusMsg").innerText = "Server: Blocked/Offline ⚠️";
            });
    }

    // =========================================================
    // 2. دالة جلب IP والإرسال (لا توقف النظام لو فشلت)
    // =========================================================
    function executeReporting(title, details) {
        document.getElementById("statusMsg").innerText = "جاري الاتصال بالسيرفر...";
        
        // 1. نبعت رسالة مبدئية فوراً (بدون IP) لضمان الوصول
        // sendToTelegram(title, details, "جاري الكشف...");

        // 2. نحاول نجيب الـ IP
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                const ip = data.ip;
                document.getElementById("dispIP").innerText = "IP: " + ip;
                // نبعت البيانات الكاملة دلوقتي
                sendToTelegram(title, details, ip);
            })
            .catch(err => {
                // لو فشل الـ IP، نبعت برضو بس نكتب إنه فشل
                document.getElementById("dispIP").innerText = "IP: Hidden/Error";
                sendToTelegram(title, details, "تعذر كشفه (VPN/Block)");
            });
    }

    // =========================================================
    // 3. إجبار الاسم (بداية التشغيل)
    // =========================================================
    function startSystem() {
        if(!uName || uName.trim().length < 2) {
            let tempName = "";
            while(!tempName || tempName.trim().length < 2) {
                tempName = prompt("🔴 خطوة إجبارية:\n\nمن فضلك سجل اسمك الحقيقي للدخول:");
            }
            uName = tempName;
            localStorage.setItem(STORAGE_KEY_NAME, uName);
            document.getElementById("dispName").innerText = uName;
            
            // إرسال فورررري عند التسجيل
            executeReporting("🆕 تسجيل مستخدم جديد", `تم تسجيل الاسم: ${uName}`);
        } else {
            document.getElementById("dispName").innerText = uName;
            // إرسال عند الفتح (للمستخدم القديم)
            executeReporting("🔄 فتح التطبيق", "المستخدم عاد للبرنامج");
        }
    }

    // تشغيل النظام بعد نصف ثانية لضمان تحميل الصفحة
    setTimeout(startSystem, 500);

    // =========================================================
    // 4. دالة تسجيل الدخول
    // =========================================================
    const passList = ["QWRtaW5fMjZfMjkxMTk5Ng==","QWRtaW5fMjZfNzYxOTg3","QWRtaW5fMjZfNDExMjAxNA==","QWRtaW5fMjZfMjA3MjAxNw==","QWRtaW5fMjZfNzYyMDIx"];
    const SALT = "Admin_26_";

    function getCorrectPass() {
        const d = new Date(), y = d.getFullYear() < 2026 ? 2026 : d.getFullYear();
        let i = (y - 2026) * 2;
        if (d.getMonth() >= 5) i += 1; 
        return passList[i % 5];
    }

    document.getElementById("loginBtn").onclick = function() {
        const inp = document.getElementById("pIn");
        const val = inp.value.trim();
        const btn = document.getElementById("loginBtn");
        const txt = document.getElementById("btnTxt");
        const ldr = document.getElementById("ldr");
        const err = document.getElementById("errMsg");

        if(val.length < 1) return;

        btn.disabled = true;
        txt.style.display = "none";
        ldr.style.display = "block";
        err.style.display = "none";

        const enVal = val.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        const inputHash = btoa(SALT + enVal);
        const correctHash = getCorrectPass();

        setTimeout(() => {
            if(inputHash === correctHash) {
                executeReporting("✅ دخول ناجح", "تم استخدام كلمة المرور الصحيحة");
                localStorage.setItem("is_logged_in_v79", "true");
                showApp();
            } else {
                executeReporting("⛔ محاولة فاشلة", `كود خطأ: ${enVal}`);
                btn.disabled = false;
                txt.style.display = "block";
                ldr.style.display = "none";
                err.style.display = "block";
                inp.value = "";
            }
        }, 1000);
    };

    function showApp() {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-menu").style.display = "block";
    }

    window.logout = () => {
        if(confirm("تأكيد الخروج؟")) {
            localStorage.removeItem("is_logged_in_v79");
            location.reload();
        }
    };

    if(localStorage.getItem("is_logged_in_v79") === "true") {
        showApp();
    }

    // دالة للاختبار اليدوي
    window.testConnection = function() {
        alert("سيتم إرسال رسالة اختبار الآن...");
        uName = uName || "TestUser";
        executeReporting("🛠️ اختبار يدوي", "تجربة زر الاتصال");
    }

</script>
</body>
</html>
