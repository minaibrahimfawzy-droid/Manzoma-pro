<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin V81</title>
    <style>
        body { background: #000; color: lime; font-family: sans-serif; text-align: center; padding: 20px; }
        input, button { padding: 10px; width: 80%; margin: 10px 0; font-size: 18px; }
        button { background: lime; color: black; border: none; font-weight: bold; cursor: pointer; }
        #status { color: yellow; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>🔥 النظام الإجباري V81 🔥</h2>
    <p>الاسم المسجل: <b id="showName" style="color:white">...</b></p>
    
    <!-- زرار يدوي عشان لو الأوتوماتيك معلق -->
    <button onclick="forceSend()"> اضغط هنا لإرسال البيانات الآن </button>
    <p id="status">انتظار...</p>

    <hr>
    <input type="password" placeholder="كود الدخول">
    <button>دخول</button>

<script>
    // بياناتك (ثابتة)
    const BOT = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT = "-1003886528114";
    
    // مفاتيح التخزين
    const KEY_NAME = "NAME_V81_FINAL";
    const KEY_ID = "ID_V81_FINAL";

    // 1. التأكد من الآيدي
    let myID = localStorage.getItem(KEY_ID);
    if (!myID) {
        myID = "ID-" + Math.floor(Math.random() * 100000);
        localStorage.setItem(KEY_ID, myID);
    }

    // 2. إجبار الاسم
    let myName = localStorage.getItem(KEY_NAME);
    
    function startSequence() {
        if (!myName || myName.length < 3) {
            let input = prompt("⚠️ تنبيه هام:\nيجب كتابة اسمك الحقيقي للدخول:");
            if (input && input.length > 2) {
                myName = input;
                localStorage.setItem(KEY_NAME, myName);
                document.getElementById("showName").innerText = myName;
                forceSend("تسجيل جديد");
            } else {
                startSequence(); // يعيد الطلب لو مكتبش
            }
        } else {
            document.getElementById("showName").innerText = myName;
            forceSend("فتح البرنامج");
        }
    }

    // 3. دالة الإرسال (طريقة الصورة المخفية)
    function forceSend(action = "تحديث") {
        document.getElementById("status").innerText = "جاري الإرسال...";
        
        const msg = `🚨 *SYSTEM V81*\n👤 Name: ${myName}\n🆔 ID: ${myID}\n📝 Action: ${action}`;
        
        // رابط تليجرام المباشر
        const url = `https://api.telegram.org/bot${BOT}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;

        // خدعة الصورة (بتعدي من الحظر)
        const img = new Image();
        img.src = url;
        
        // مفيش رد هيجي لأنها صورة، بس بنفترض الوصول
        setTimeout(() => {
            document.getElementById("status").innerText = "✅ تم إرسال الطلب للسيرفر";
            document.getElementById("status").style.color = "lime";
        }, 1000);
    }

    // تشغيل فوري
    setTimeout(startSequence, 500);

</script>

</body>
</html>
