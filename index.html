<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System 2026 Loader</title>
<style>
    body {
        background-color: #0d1117;
        color: #c9d1d9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        user-select: none;
    }
    .loader-container {
        text-align: center;
        padding: 20px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 85%;
        max-width: 320px;
    }
    .loader {
        border: 4px solid #30363d;
        border-top: 4px solid #238636;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
    }
    .status-text {
        font-size: 13px;
        color: #8b949e;
        margin-bottom: 10px;
    }
    .progress-bar {
        width: 100%;
        background-color: #30363d;
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
        margin-top: 10px;
        display: none;
    }
    .progress-fill {
        height: 100%;
        background-color: #238636;
        width: 0%;
        transition: width 0.3s;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body oncontextmenu="return false">

    <div class="loader-container">
        <div class="loader" id="spinner"></div>
        <h3 style="margin:0 0 10px 0; color:#fff">نظام 2026</h3>
        <div class="status-text" id="status">جاري الاتصال...</div>
        <div class="progress-bar" id="pBar"><div class="progress-fill" id="pFill"></div></div>
    </div>

<script>
    // ============================================================
    // الإعدادات
    // ============================================================
    const REPO_URL = "https://raw.githubusercontent.com/minaibrahimfawzy-droid/Manzoma-pro/main/";
    
    // أسماء ملفاتك
    const APP_FILES = [
        "home.html", 
        "Nabatshia.html", 
        "2.html", 
        "3.html", 
        "4.html", 
        "5.html", 
        "6.html"
    ];

    // ============================================================
    // 1. كود إصلاح الشاشة (عشان الكلام ميكبرش)
    // ============================================================
    const FIX_LAYOUT = '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">';

    // ============================================================
    // 2. كود زر الرجوع (HTML ثابت)
    // ============================================================
    // الزر ده هيتحط في كل الصفحات ما عدا home.html
    const HOME_BTN = `
        <div id="sys-home-floater" onclick="window.go('home.html')" 
             style="position:fixed; bottom:20px; left:20px; width:55px; height:55px; 
             background:#238636; color:white; border-radius:50%; 
             text-align:center; line-height:55px; font-size:28px; 
             box-shadow: 0 5px 15px rgba(0,0,0,0.6); z-index:2147483647 !important; 
             cursor:pointer; border: 2px solid #fff; display:block;">
             🏠
        </div>
    `;

    // ============================================================
    // 3. سكربت التشغيل والتنقل
    // ============================================================
    const LOGIC_SCRIPT = `
    <script>
        window.go = function(pageName) {
            // توجيه index لـ home
            if(pageName === "index.html" || pageName === "home.html") {
                pageName = "home.html";
                // مسح الهيستوري عشان لو داس رجوع وهو في الرئيسية يخرج أو يقف مكانه
                history.replaceState(null, null, " ");
            } else {
                // لو صفحة فرعية، سجلها في التاريخ
                history.pushState({p: pageName}, null, "#"+pageName);
            }

            const storedPage = localStorage.getItem("sys_file_" + pageName);
            if(storedPage) {
                document.open();
                document.write(storedPage);
                document.close();
            } else {
                window.go("home.html");
            }
        };

        // منع الخروج عند الضغط على زر الرجوع في الموبايل
        window.onpopstate = function(event) {
            window.go("home.html");
        };

        document.oncontextmenu = function(){return false;};
    <\/script>
    `;

    // ============================================================
    // دالة التحميل
    // ============================================================
    const uiStatus = document.getElementById("status");
    const uiPBar = document.getElementById("pBar");
    const uiPFill = document.getElementById("pFill");

    async function bootSystem() {
        
        // خطوة مهمة: مسح النسخة القديمة لإجبار التحديث وحل المشاكل
        // السطر ده هيشتغل مرة واحدة بس عشان نضمن إن الملفات اتصلحت
        if(!sessionStorage.getItem("repair_done")) {
            localStorage.removeItem("sys_version");
            sessionStorage.setItem("repair_done", "true");
        }

        let localVer = parseFloat(localStorage.getItem("sys_version")) || 0;

        if (navigator.onLine) {
            try {
                // طلب ملف الإصدار
                const vResponse = await fetch(REPO_URL + "version.json?t=" + Date.now());
                if (vResponse.ok) {
                    const vData = await vResponse.json();
                    const remoteVer = parseFloat(vData.version);

                    // لو فيه تحديث أو لو دي أول مرة بعد المسح
                    if (remoteVer > localVer || localVer === 0) {
                        uiStatus.innerText = `جاري إصلاح الملفات وتحديث النظام...`;
                        uiPBar.style.display = "block";
                        
                        let count = 0;
                        for (const fileName of APP_FILES) {
                            count++;
                            uiStatus.innerText = `معالجة: ${fileName}`;
                            uiPFill.style.width = Math.round((count / APP_FILES.length) * 100) + "%";
                            
                            const fResponse = await fetch(REPO_URL + fileName + "?t=" + Date.now());
                            if (!fResponse.ok) throw new Error("فشل: " + fileName);
                            
                            let content = await fResponse.text();

                            // ----------------------------------------------------
                            // 1. إصلاح مشكلة الحجم الكبير (نضيف Viewport غصب عن الملف)
                            // ----------------------------------------------------
                            if (!content.includes("viewport")) {
                                // بنحطه في أول الملف عشان المتصفح يشوفه فوراً
                                content = FIX_LAYOUT + content;
                            }

                            // ----------------------------------------------------
                            // 2. إضافة السكربت الأساسي لكل الملفات
                            // ----------------------------------------------------
                            if(content.includes("</body>")) {
                                content = content.replace("</body>", LOGIC_SCRIPT + "</body>");
                            } else {
                                content += LOGIC_SCRIPT;
                            }

                            // ----------------------------------------------------
                            // 3. إضافة زر الرجوع (لكل الملفات ما عدا الرئيسية)
                            // ----------------------------------------------------
                            if (fileName !== "home.html") {
                                // بنضيف الزر كـ HTML مباشر
                                if(content.includes("</body>")) {
                                    content = content.replace("</body>", HOME_BTN + "</body>");
                                } else {
                                    content += HOME_BTN;
                                }
                            }

                            localStorage.setItem("sys_file_" + fileName, content);
                        }
                        
                        localStorage.setItem("sys_version", remoteVer);
                        uiStatus.innerText = "✅ تم الإصلاح والتحديث!";
                        await new Promise(r => setTimeout(r, 800));
                    }
                }
            } catch (err) {
                console.log("Error", err);
                uiStatus.innerText = "فشل الاتصال، جاري المحاولة...";
            }
        }

        // تشغيل الصفحة الرئيسية
        setTimeout(() => {
            const startPage = localStorage.getItem("sys_file_home.html");
            if (startPage) {
                document.open();
                document.write(startPage);
                document.close();
            } else {
                // لو مفيش نت والملفات مش موجودة
                uiPBar.style.display = "none";
                uiStatus.innerHTML = "<span style='color:#da3633; font-weight:bold;'>⚠️ خطأ: يجب توصيل الإنترنت لإصلاح الملفات</span>";
            }
        }, 1000);
    }

    bootSystem();
</script>
</body>
</html>
