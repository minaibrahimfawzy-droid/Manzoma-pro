<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System 2026 Loader</title>
<style>
    body {
        background-color: #0d1117;
        color: #c9d1d9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        user-select: none;
    }
    .loader-container {
        text-align: center;
        padding: 20px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 85%;
        max-width: 320px;
    }
    .loader {
        border: 4px solid #30363d;
        border-top: 4px solid #238636;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
    }
    .status-text {
        font-size: 13px;
        color: #8b949e;
        margin-bottom: 10px;
    }
    .progress-bar {
        width: 100%;
        background-color: #30363d;
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
        margin-top: 10px;
        display: none;
    }
    .progress-fill {
        height: 100%;
        background-color: #238636;
        width: 0%;
        transition: width 0.3s;
    }
    .error-msg {
        color: #da3633;
        font-size: 12px;
        margin-top: 15px;
        display: none;
        border: 1px solid rgba(218, 54, 51, 0.4);
        padding: 10px;
        border-radius: 6px;
        background: rgba(218, 54, 51, 0.1);
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body oncontextmenu="return false">

    <div class="loader-container">
        <div class="loader" id="spinner"></div>
        <h3 style="margin:0 0 10px 0; color:#fff">نظام 2026</h3>
        <div class="status-text" id="status">جاري الاتصال...</div>
        <div class="progress-bar" id="pBar"><div class="progress-fill" id="pFill"></div></div>
        <div class="error-msg" id="errorBox"></div>
    </div>

<script>
    // ============================================================
    // إعدادات النظام
    // ============================================================
    const REPO_URL = "https://raw.githubusercontent.com/minaibrahimfawzy-droid/Manzoma-pro/main/";
    
    // قائمة الملفات
    const APP_FILES = ["home.html", "Nabatshia.html", "2.html", "3.html", "4.html", "5.html", "6.html"];
    
    // ============================================================
    // كود الحقن القوي (تم تعديله ليضمن ظهور الزر)
    // ============================================================
    const INJECTED_SCRIPT = `
    <script>
        // دالة التنقل
        window.go = function(pageName) {
            if(pageName === "index.html") pageName = "home.html";
            localStorage.setItem("sys_current_page", pageName);

            if(pageName !== "home.html") {
                history.pushState({page: pageName}, null, "#" + pageName);
            } else {
                history.replaceState(null, null, " ");
            }

            const storedPage = localStorage.getItem("sys_file_" + pageName);
            if(storedPage) {
                document.open();
                document.write(storedPage);
                document.close();
            } else {
                window.go("home.html");
            }
        };

        // معالجة زر الرجوع في الموبايل
        window.onpopstate = function(event) {
            window.go("home.html");
        };

        // دالة رسم الزر (تعمل بمؤقت لضمان التنفيذ)
        function injectHomeButton() {
            // لو الصفحة هي الرئيسية، لا تفعل شيء
            const cp = localStorage.getItem("sys_current_page");
            if (!cp || cp === "home.html") return;

            // لو الزر موجود بالفعل، لا تفعل شيء
            if (document.getElementById('sys-home-floater')) return;

            // لو الجسم (body) غير جاهز، حاول كمان شوية
            if (!document.body) {
                setTimeout(injectHomeButton, 100);
                return;
            }

            // رسم الزر
            const btn = document.createElement("div");
            btn.id = 'sys-home-floater';
            btn.innerHTML = "🏠";
            // ستايل الزر (تم رفع z-index لأقصى درجة)
            btn.style.cssText = "position:fixed; bottom:20px; left:20px; width:55px; height:55px; background:#238636; color:white; border-radius:50%; text-align:center; line-height:55px; font-size:26px; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.8); z-index:2147483647; border: 2px solid #fff;";
            
            btn.onclick = function() { window.go('home.html'); };
            
            document.body.appendChild(btn);
        }

        // تشغيل محاولة رسم الزر فوراً وبعد تحميل الصفحة
        injectHomeButton();
        window.addEventListener('load', injectHomeButton);
        // محاولة إضافية كل ثانية للتأكيد (في حالة الصفحات الثقيلة)
        setInterval(injectHomeButton, 1000);

        document.oncontextmenu = function(){return false;};
    <\/script>
    `;

    const uiStatus = document.getElementById("status");
    const uiError = document.getElementById("errorBox");
    const uiPBar = document.getElementById("pBar");
    const uiPFill = document.getElementById("pFill");
    const uiSpinner = document.getElementById("spinner");

    async function bootSystem() {
        // !!! سطر المسح الإجباري (مهم جداً الآن لتحديث الملفات القديمة) !!!
        localStorage.removeItem("sys_version");

        let localVer = parseFloat(localStorage.getItem("sys_version")) || 0;

        if (navigator.onLine) {
            uiStatus.innerText = "فحص التحديثات...";
            try {
                const vResponse = await fetch(REPO_URL + "version.json?t=" + Date.now());
                if (vResponse.ok) {
                    const vData = await vResponse.json();
                    const remoteVer = parseFloat(vData.version);

                    // التحديث سيعمل دائماً بسبب سطر المسح الإجباري
                    if (remoteVer > localVer || localVer === 0) {
                        uiStatus.innerText = `تحديث الملفات (إضافة الأزرار)...`;
                        uiPBar.style.display = "block";
                        
                        let count = 0;
                        for (const fileName of APP_FILES) {
                            count++;
                            uiStatus.innerText = `تحميل: ${fileName}`;
                            uiPFill.style.width = Math.round((count / APP_FILES.length) * 100) + "%";
                            
                            const fResponse = await fetch(REPO_URL + fileName + "?t=" + Date.now());
                            if (!fResponse.ok) throw new Error("فشل: " + fileName);
                            
                            let content = await fResponse.text();

                            // نضع الكود في نهاية الملف لضمان عمله
                            if(content.includes("</body>")) {
                                content = content.replace("</body>", INJECTED_SCRIPT + "</body>");
                            } else {
                                content += INJECTED_SCRIPT;
                            }

                            localStorage.setItem("sys_file_" + fileName, content);
                        }
                        localStorage.setItem("sys_version", remoteVer);
                        uiStatus.innerText = "✅ تم التحديث!";
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
            } catch (err) {
                console.log("Offline/Error", err);
                uiStatus.innerText = "وضع عدم الاتصال...";
            }
        }

        setTimeout(() => {
            const startPage = localStorage.getItem("sys_file_home.html");

            if (startPage) {
                localStorage.setItem("sys_current_page", "home.html");
                history.replaceState(null, null, " ");
                document.open();
                document.write(startPage);
                document.close();
            } else {
                uiSpinner.style.display = "none";
                uiPBar.style.display = "none";
                uiStatus.style.display = "none";
                uiError.style.display = "block";
                uiError.innerHTML = `
                    ⚠️ <b>تنبيه هام</b><br><br>
                    لم يتم العثور على ملفات النظام.<br>
                    يرجى توصيل الإنترنت لتحميل النسخة الجديدة.
                `;
            }
        }, 1000);
    }

    bootSystem();
</script>
</body>
</html>
