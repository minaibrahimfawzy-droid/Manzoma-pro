<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System 2026 Pro</title>
<style>
    body{font-family:'Segoe UI',Tahoma,sans-serif;background-color:#0d1117;color:#c9d1d9;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none;overflow:hidden}
    #lock-screen{background:#161b22;border:1px solid #30363d;padding:30px;border-radius:12px;text-align:center;width:85%;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.5); position:relative; z-index:10;}
    input{background:#0d1117;border:1px solid #30363d;color:#58a6ff;padding:12px;width:100%;text-align:center;font-size:16px;border-radius:6px;margin:10px 0;outline:none;box-sizing:border-box}
    input:focus{border-color:#58a6ff;}
    button.main-btn{background:#238636;color:#fff;border:none;padding:12px 0;width:100%;font-size:16px;font-weight:bold;border-radius:6px;cursor:pointer;margin-top:10px; transition:0.3s}
    button.main-btn:disabled{background:#114a1c; color:#8b949e; cursor:not-allowed}
    .logout-btn{background:#da3633;color:white;border:none;padding:6px 12px;font-size:12px;font-weight:bold;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px}
    .error{color:#f85149;margin-top:10px;display:none;font-weight:bold;font-size:13px;background:rgba(218,54,51,0.1);padding:5px;border-radius:4px;border:1px solid rgba(218,54,51,0.3)}
    
    #app-menu{display:none;width:100%;height:100vh;padding:20px;box-sizing:border-box;overflow-y:auto}
    .menu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid #30363d;padding-bottom:15px}
    .user-info{text-align:right; font-size:14px; color:#8b949e;}
    .user-info span {color:#58a6ff; font-weight:bold;}
    
    .datetime{text-align:center; font-size:13px; color:#238636; margin-bottom:20px; font-weight:bold; background:#161b22; padding:10px; border-radius:8px; border:1px solid #30363d;}
    
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding-bottom:20px}
    .app-btn{background:#21262d;border:1px solid #30363d;border-radius:10px;padding:15px;text-decoration:none;color:#c9d1d9;display:flex;flex-direction:column;align-items:center;justify-content:center;height:110px;text-align:center; cursor:pointer; transition:0.2s}
    .app-btn:active{transform:scale(0.95); background:#30363d;}
    .icon{font-size:28px;margin-bottom:8px}
    
    .tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;border-top:1px solid #30363d;padding-top:20px;}
    .tool-btn{background:#1f6feb;color:#fff;border:none;padding:10px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:bold;}
    .tool-btn.restore{background:#9e6a03;}
    
    /* شاشة التحديث الإجباري */
    #update-screen{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(13,17,23,0.95); z-index:999; flex-direction:column; align-items:center; justify-content:center;}
    #update-screen .box{background:#161b22; padding:30px; border-radius:12px; text-align:center; border:1px solid #f85149; box-shadow:0 0 30px rgba(248,81,73,0.3); width:80%;}
    #update-screen button{background:#f85149; color:#fff; border:none; padding:12px 20px; font-size:16px; border-radius:6px; cursor:pointer; margin-top:20px; font-weight:bold;}
</style>
</head>
<body oncontextmenu="return false">

<!-- شاشة التحديث -->
<div id="update-screen">
    <div class="box">
        <div style="font-size:50px; margin-bottom:10px;">⚠️</div>
        <h2 style="color:#fff;">تحديث هام مطلوب!</h2>
        <p style="color:#8b949e;">يوجد إصدار جديد، يجب التحديث للمتابعة.</p>
        <button id="updateBtn">تحميل التحديث الآن</button>
    </div>
</div>

<div id="lock-screen">
    <div style="font-size:40px;margin-bottom:10px;">🛡️</div>
    <h2 style="margin:0;color:#fff;font-size:18px;">نظام 2026 المحمي</h2>
    
    <input type="text" id="userName" placeholder="الاسم ثلاثي (عربي فقط)...">
    <input type="tel" id="pIn" placeholder="أدخل كود المرور" maxlength="10">
    
    <button class="main-btn" id="loginBtn" onclick="login()">تفعيل ودخول</button>
    
    <p id="devID" style="font-size:12px;color:#58a6ff;font-family:monospace;margin-top:15px;background:#0d1117;padding:5px;border-radius:4px;border:1px dashed #30363d"></p>
    <p id="eMsg" class="error">⛔ الكود غير صحيح!</p>
</div>

<div id="app-menu">
    <div class="menu-header">
        <div>
            <h2 style="margin:0; font-size:18px; color:#fff; text-align:right;">الرئيسية</h2>
            <div class="user-info" id="displayUserName">مرحباً: <span></span></div>
        </div>
        <button id="logoutBtn" class="logout-btn" onclick="logout()"><span>خروج</span> 🚪</button>
    </div>
    
    <div class="datetime" id="clock">جاري تحميل الوقت...</div>
    
    <div class="grid" id="apps-container"></div>
    
    <div class="tools-grid">
        <button class="tool-btn" onclick="backupDataCode()">📥 نسخ كود البيانات</button>
        <button class="tool-btn restore" onclick="restoreDataCode()">📤 استعادة من كود</button>
    </div>
</div>

<script>
    const CURRENT_VERSION = "1.0"; // لا تغير هذا الرقم أبداً من هنا
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";
    const SECRET_KEY = "QWRtaW5fMjZf";
    const PASS_ARRAY = ["QWRtaW5fMjZfMjkxMTk5Ng==","QWRtaW5fMjZfNzYxOTg3","QWRtaW5fMjZfNDExMjAxNA==","QWRtaW5fMjZfMjA3MjAxNw==","QWRtaW5fMjZfNzYyMDIx"];

    let failAttempts = 0;
    
    let systemApps = [
        {name: "النبطشية", icon: "📅", url: "Nabatshia.html"},
        {name: "الورديات", icon: "🌙", url: "2.html"},
        {name: "التصفيات", icon: "⚖️", url: "3.html"},
        {name: "اللمات", icon: "📝", url: "4.html"},
        {name: "التدفق", icon: "🌊", url: "5.html"},
        {name: "المهيئ والمواسير", icon: "🏗️", url: "6.html"}
    ];

    let deviceID = localStorage.getItem("_u_id");
    if(!deviceID) {
        deviceID = "ID-" + Math.floor(Math.random() * 89999 + 10000);
        localStorage.setItem("_u_id", deviceID);
    }
    document.getElementById("devID").innerText = "معرف جهازك: " + deviceID;

    setInterval(() => {
        const d = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: true };
        document.getElementById("clock").innerText = d.toLocaleDateString('ar-EG', options);
    }, 1000);

    function renderApps(appsArray) {
        const container = document.getElementById("apps-container");
        container.innerHTML = "";
        appsArray.forEach(app => {
            let div = document.createElement("div");
            div.className = "app-btn";
            div.onclick = () => window.location.href = app.url;
            div.innerHTML = `<span class="icon">${app.icon}</span>${app.name}`;
            container.appendChild(div);
        });
    }

    function getTruePass() {
        const d = new Date();
        let y = d.getFullYear() < 2026 ? 2026 : d.getFullYear();
        let i = (y - 2026) * 2;
        if (d.getMonth() >= 5) i += 1; 
        return PASS_ARRAY[i % 5];
    }

    function sendToTelegram(name, type="login") {
        if(!navigator.onLine) return;
        fetch("https://api.ipify.org?format=json", { cache: "no-store" })
        .then(res => res.json())
        .then(data => {
            let ip = data.ip;
            let text = type === "login" 
                ? `✅ *دخول ناجح للتطبيق*\n👤 الاسم: *${name}*\n🆔 الجهاز: \`${deviceID}\`\n🌐 الأيبي: \`${ip}\``
                : `🚨 *محاولة اختراق (3 مرات خطأ)*\n👤 الاسم: *${name}*\n🆔 الجهاز: \`${deviceID}\`\n🌐 الأيبي: \`${ip}\``;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;
            fetch(url).catch(()=>{});
        }).catch(()=>{});
    }

    function isValidArabicName(name) {
        const regex = /^[\u0600-\u06FF\s]+$/; 
        const words = name.trim().split(/\s+/);
        return regex.test(name) && words.length >= 3;
    }

    // ==========================================
    // 🛡️ فحص حالة التطبيق وقفل/طرد المستخدمين من التليجرام
    // ==========================================
    function checkAppStatusFromTelegram() {
        if(!navigator.onLine) return; // لو مفيش نت هيشتغل عادي من الكاش

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/getChat?chat_id=${CHAT_ID}`;

        fetch(url)
        .then(res => res.json())
        .then(data => {
            if(data.ok && data.result.description) {
                let desc = data.result.description;
                
                // 1. الإيقاف الإجباري للجميع
                if(desc.includes("[OFF]")) {
                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0d1117; color:#f85149; text-align:center; padding:20px; width:100%; box-sizing:border-box;">
                            <div style="font-size:70px; margin-bottom:15px;">⛔</div>
                            <h1 style="margin:0;">تم إيقاف النظام</h1>
                            <p style="color:#8b949e; font-size:16px; margin-top:10px;">عذراً، تم إيقاف التطبيق مؤقتاً لجميع المستخدمين من قبل الإدارة.</p>
                        </div>
                    `;
                    return; // توقف عن تنفيذ باقي الكود
                }

                // 2. طرد شخص معين برقم جهازه
                if(desc.includes("BAN:" + deviceID)) {
                    // حذف توثيق الدخول الخاص به
                    localStorage.removeItem("_tkn_auth"); 
                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0d1117; color:#f85149; text-align:center; padding:20px; width:100%; box-sizing:border-box;">
                            <div style="font-size:70px; margin-bottom:15px;">🚫</div>
                            <h1 style="margin:0;">حظر الدخول</h1>
                            <p style="color:#8b949e; font-size:16px; margin-top:10px;">تم حظر جهازك (${deviceID}) وطرده من النظام.</p>
                        </div>
                    `;
                }
            }
        }).catch(()=>{}); // تجاهل لو حصل خطأ في الاتصال بتليجرام
    }

    function login() {
        const nameInp = document.getElementById("userName").value.trim();
        const pinInp = document.getElementById("pIn").value.trim();
        const errorMsg = document.getElementById("eMsg");

        if(!isValidArabicName(nameInp)) { 
            alert("⚠️ يجب كتابة اسمك الثلاثي باللغة العربية فقط (يمنع استخدام الأرقام)."); 
            return; 
        }
        if(pinInp.length < 1) return;

        const btn = document.getElementById("loginBtn");
        btn.disabled = true;
        btn.innerText = "جاري الدخول...";

        const enVal = pinInp.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        const hash = btoa(atob(SECRET_KEY) + enVal);

        if (hash === getTruePass()) {
            failAttempts = 0;
            localStorage.setItem("_tkn_auth", hash);
            localStorage.setItem("_u_name", nameInp);
            sendToTelegram(nameInp, "login"); 
            showApp(true);
        } else {
            failAttempts++;
            errorMsg.style.display = "block";
            errorMsg.innerText = `⛔ الكود غير صحيح! (محاولة ${failAttempts}/3)`;
            if(failAttempts >= 3) {
                sendToTelegram(nameInp, "alert");
                alert("🚨 تم حظر المحاولة وتنبيه الإدارة بأنك تدخل كود خاطئ.");
                failAttempts = 0;
            }
        }
        btn.disabled = false;
        btn.innerText = "تفعيل ودخول";
    }

    function showApp(isLoggedIn) {
        if(isLoggedIn) {
            document.getElementById("lock-screen").style.display = "none";
            document.getElementById("app-menu").style.display = "block";
            document.querySelector("#displayUserName span").innerText = localStorage.getItem("_u_name");
            
            // في حالة عدم وجود الكنترول بيعرض البرامج الافتراضية كإحتياطي
            let cached = localStorage.getItem("_cached_apps");
            if (!document.getElementById("control-script-loaded")) {
                renderApps(cached ? JSON.parse(cached) : systemApps);
            }
        } else {
            document.getElementById("lock-screen").style.display = "block";
            document.getElementById("app-menu").style.display = "none";
        }
    }

    // فحص الأوامر من التليجرام عند عودة الإنترنت
    window.addEventListener('online', () => {
        checkAppStatusFromTelegram();
    });

    // ==========================================
    // 📥 دالة النسخ الاحتياطي
    // ==========================================
    function backupDataCode() {
        let safeData = {};
        for(let i=0; i<localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key !== "_tkn_auth" && key !== "_u_id" && key !== "_u_name" && key !== "_cached_apps") {
                safeData[key] = localStorage.getItem(key);
            }
        }
        
        if(Object.keys(safeData).length === 0) {
            alert("⚠️ لا توجد بيانات محفوظة لعمل نسخة احتياطية.");
            return;
        }

        try {
            const jsonStr = JSON.stringify(safeData);
            const backupCode = btoa(encodeURIComponent(jsonStr));

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(backupCode).then(() => {
                    alert("✅ تم نسخ كود النسخة الاحتياطية بنجاح!\nاحتفظ به في مكان آمن (مثل رسائل الواتساب المحفوظة).");
                }).catch(() => {
                    prompt("انسخ الكود التالي واحتفظ به:", backupCode);
                });
            } else {
                prompt("انسخ الكود التالي واحتفظ به في مكان آمن:", backupCode);
            }
        } catch(err) {
            alert("❌ حدث خطأ أثناء إنشاء الكود.");
        }
    }

    // ==========================================
    // 📤 دالة الاستعادة 
    // ==========================================
    function restoreDataCode() {
        let backupCode = prompt("📌 برجاء لصق كود الاستعادة هنا:");
        
        if(!backupCode || backupCode.trim() === "") return;

        try {
            const jsonStr = decodeURIComponent(atob(backupCode.trim()));
            const data = JSON.parse(jsonStr);

            let count = 0;
            for(let key in data) {
                localStorage.setItem(key, data[key]);
                count++;
            }

            if(count > 0) {
                alert("✅ تمت استعادة البيانات بنجاح!");
                location.reload(); 
            } else {
                alert("⚠️ الكود صالح لكنه لا يحتوي على بيانات.");
            }
        } catch(err) { 
            alert("❌ فشلت الاستعادة! الكود غير صحيح أو غير مكتمل."); 
        }
    }

    // عند تشغيل التطبيق
    window.onload = function() {
        checkAppStatusFromTelegram(); // أول شيء يعمل هو فحص الحظر أو الإيقاف
        showApp(localStorage.getItem("_tkn_auth") === getTruePass());
    };

    function logout() {
        localStorage.removeItem("_tkn_auth");
        location.reload();
    }
</script>

<!-- ربط النظام بملف الكنترول المحلى عشان يشتغل أوفلاين ويقرأ التحديثات -->
<script id="control-script-loaded" src="./control.js"></script>

<!-- تفعيل نظام السيرفيس ووركر للأوفلاين -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js')
            .then(function(reg) {
                console.log('Service Worker Registered Successfully', reg.scope);
            }).catch(function(err) {
                console.log('Service Worker Registration Failed', err);
            });
        });
    }
</script>

</body>
</html>
