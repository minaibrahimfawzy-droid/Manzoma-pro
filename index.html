<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System 2026 Pro [V53]</title>
<style>
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#0d1117;color:#c9d1d9;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none;-webkit-user-select:none}
    #lock-screen{background:#161b22;border:1px solid #30363d;padding:30px;border-radius:12px;text-align:center;width:85%;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    input{background:#0d1117;border:1px solid #30363d;color:#58a6ff;padding:12px;width:100%;text-align:center;font-size:20px;border-radius:6px;margin:15px 0;outline:none;letter-spacing:1px}
    button.main-btn{background:#238636;color:#fff;border:none;padding:12px 0;width:100%;font-size:16px;font-weight:bold;border-radius:6px;cursor:pointer;margin-top:10px;transition:0.2s}
    button.main-btn:active{transform:scale(0.98)}
    button.main-btn:disabled{background:#30363d;color:#8b949e;cursor:not-allowed}
    .info-box {background:#0d1117; padding:10px; border-radius:8px; border:1px dashed #30363d; margin: 15px 0; text-align:center;}
    .status-log {font-size: 10px; color: #8b949e; margin-top: 10px; font-family: monospace;}
    .error{color:#f85149;margin-top:10px;display:none;font-weight:bold;font-size:13px}
    #app-menu{display:none;width:100%;height:100vh;padding:20px;box-sizing:border-box;overflow-y:auto}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding-bottom:20px}
    .app-btn{background:#21262d;border:1px solid #30363d;border-radius:10px;padding:15px;color:#c9d1d9;display:flex;flex-direction:column;align-items:center;justify-content:center;height:110px;text-decoration:none}
    
    .loader {border: 3px solid #f3f3f3; border-top: 3px solid #238636; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display:none; margin:0 auto;}
    @keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}
</style>
</head>
<body oncontextmenu="return false">

<!-- شاشة القفل -->
<div id="lock-screen">
    <div style="font-size:40px;margin-bottom:10px;">🛡️</div>
    <h2 style="margin:0;color:#fff;font-size:18px;">نظام 2026</h2>
    <p style="font-size:11px;color:#8b949e;">Secure Access V53</p>
    
    <div class="info-box">
        <p style="margin:0;font-size:10px;color:#8b949e">User Identity:</p>
        <p id="dispName" style="margin:5px 0;color:#238636;font-weight:bold;font-size:15px">...</p>
        <p id="dispID" style="margin:0;font-size:10px;color:#58a6ff;font-family:monospace">Detecting...</p>
    </div>

    <input type="tel" id="pIn" placeholder="أدخل كود المرور" maxlength="10">
    
    <button class="main-btn" id="loginBtn">
        <span id="btnTxt">تسجيل الدخول</span>
        <div class="loader" id="ldr"></div>
    </button>
    
    <!-- منطقة لعرض حالة الاتصال (للتشخيص) -->
    <div id="statusLog" class="status-log">Ready.</div>
    <p id="errMsg" class="error">⛔ الكود غير صحيح!</p>
</div>

<!-- القائمة الرئيسية -->
<div id="app-menu">
    <h2 style="color:#fff;border-bottom:1px solid #30363d;padding-bottom:15px;margin-top:0">الرئيسية</h2>
    <div class="grid">
        <div class="app-btn" onclick="go('Nabatshia.html')">📅 النبطشية</div>
        <div class="app-btn" onclick="go('2.html')">🌙 الورديات</div>
        <div class="app-btn" onclick="go('3.html')">⚖️ التصفيات</div>
        <div class="app-btn" onclick="go('4.html')">📝 اللمات</div>
        <div class="app-btn" onclick="go('5.html')">🌊 التدفق</div>
        <div class="app-btn" onclick="go('6.html')">🏗️ المواسير</div>
    </div>
    <button class="main-btn" style="background:#da3633" onclick="logout()">تسجيل خروج 🚪</button>
</div>

<script>
    // ==========================================
    // 1. القوة الغاشمة (Brute Force Reset)
    // ==========================================
    const VERSION = "53";
    
    // هذا الكود يعمل قبل أي شيء آخر
    if (localStorage.getItem("app_ver") !== VERSION) {
        console.log("Old version detected. Wiping data...");
        localStorage.clear();
        localStorage.setItem("app_ver", VERSION);
        // إعادة تحميل فورية لإجبار التطبيق
        window.location.reload();
    }

    // ==========================================
    // 2. إعدادات البوت (TELEGRAM CONFIG)
    // ==========================================
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";
    
    // ==========================================
    // 3. إدارة الهوية
    // ==========================================
    let uName = localStorage.getItem("user_full_name");
    let uID = localStorage.getItem("user_device_id");

    if (!uID) {
        uID = "DEV-" + Math.floor(Math.random() * 900000 + 100000);
        localStorage.setItem("user_device_id", uID);
    }

    // دالة طلب الاسم - لن تغلق إلا بعد الكتابة
    function forceAskName() {
        let n = "";
        // حلقة تكرارية لا تنتهي إلا بكتابة الاسم
        while (!n || n.trim().length < 4) {
            n = prompt("⚠️ إجراء أمني إجباري (V53):\n\nمن فضلك سجل اسمك الحقيقي (ثلاثي) لمرة واحدة فقط:");
        }
        localStorage.setItem("user_full_name", n);
        return n;
    }

    if (!uName) {
        uName = forceAskName();
        // إرسال تنبيه فوراً
        sendToTelegram("🆕 NEW USER", `Name Registered: ${uName}`);
        document.getElementById("dispName").innerText = uName;
    } else {
        document.getElementById("dispName").innerText = uName;
    }
    
    document.getElementById("dispID").innerText = uID;

    // ==========================================
    // 4. محرك الإرسال المطور (The Sender Engine)
    // ==========================================
    const statusLog = document.getElementById("statusLog");

    async function sendToTelegram(action, details) {
        statusLog.innerText = "Connecting to server...";
        statusLog.style.color = "#e3b341"; // Yellow

        // 1. محاولة جلب IP
        let ip = "Hidden IP";
        try {
            const ipReq = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipReq.json();
            ip = ipData.ip;
        } catch (e) {
            console.log("IP Fetch Failed");
        }

        // 2. تجهيز الرسالة
        const text = `🚨 <b>SYSTEM V53 ALERT</b>\n` +
                     `👤 <b>User:</b> ${uName}\n` +
                     `🆔 <b>ID:</b> ${uID}\n` +
                     `🌍 <b>IP:</b> <code>${ip}</code>\n` +
                     `🔒 <b>Action:</b> ${action}\n` +
                     `📄 <b>Info:</b> ${details}\n` +
                     `⌚ <b>Time:</b> ${new Date().toLocaleTimeString('ar-EG')}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`;

        // 3. محاولة الإرسال (طريقة مزدوجة)
        try {
            // الطريقة أ: Beacon (لا تنتظر الرد)
            if (navigator.sendBeacon) {
                navigator.sendBeacon(url);
            }
            
            // الطريقة ب: Image Request (تخترق الحظر عادة)
            const img = new Image();
            img.onload = function() { 
                statusLog.innerText = "✓ Server Confirmed"; 
                statusLog.style.color = "#238636"; // Green
            };
            img.onerror = function() {
                // حتى لو فشلت الصورة، الطلب غالباً وصل
                statusLog.innerText = "✓ Request Sent (Blind)"; 
                statusLog.style.color = "#238636";
            };
            img.src = url;

        } catch (err) {
            statusLog.innerText = "⚠ Connection Error";
            statusLog.style.color = "#f85149";
        }
    }

    // ==========================================
    // 5. التحقق من كلمة المرور
    // ==========================================
    const passList = ["QWRtaW5fMjZfMjkxMTk5Ng==","QWRtaW5fMjZfNzYxOTg3","QWRtaW5fMjZfNDExMjAxNA==","QWRtaW5fMjZfMjA3MjAxNw==","QWRtaW5fMjZfNzYyMDIx"];
    const SALT = "Admin_26_";

    function getCorrectPass() {
        const d = new Date(), y = d.getFullYear() < 2026 ? 2026 : d.getFullYear();
        let i = (y - 2026) * 2;
        if (d.getMonth() >= 5) i += 1; 
        return passList[i % 5];
    }

    document.getElementById("loginBtn").onclick = function() {
        const inp = document.getElementById("pIn");
        const val = inp.value.trim();
        const btn = document.getElementById("loginBtn");
        const txt = document.getElementById("btnTxt");
        const ldr = document.getElementById("ldr");
        const err = document.getElementById("errMsg");

        if(val.length < 1) return;

        btn.disabled = true;
        txt.style.display = "none";
        ldr.style.display = "block";
        err.style.display = "none";

        const enVal = val.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        const inputHash = btoa(SALT + enVal);
        const correctHash = getCorrectPass();

        // إرسال محاولة
        sendToTelegram("🔑 LOGIN ATTEMPT", `Entered: ${val}`);

        setTimeout(() => {
            if(inputHash === correctHash) {
                sendToTelegram("✅ SUCCESS LOGIN", "Access Granted");
                localStorage.setItem("is_logged_in", "true");
                showApp();
            } else {
                sendToTelegram("⛔ FAILED LOGIN", `Wrong Pass: ${val}`);
                btn.disabled = false;
                txt.style.display = "block";
                ldr.style.display = "none";
                err.style.display = "block";
                inp.value = "";
            }
        }, 1500);
    };

    function showApp() {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-menu").style.display = "block";
    }

    // ==========================================
    // 6. التحكم
    // ==========================================
    window.go = (u) => window.location.href = u;
    
    window.logout = () => {
        if(confirm("هل تريد تسجيل الخروج ومسح بيانات الجلسة؟")) {
            sendToTelegram("🚪 LOGOUT", "User Logged Out");
            localStorage.removeItem("is_logged_in");
            // لو عايز تمسح الاسم كمان شيل العلامة من السطر اللي تحت
            // localStorage.removeItem("user_full_name"); 
            location.reload();
        }
    };

    if(localStorage.getItem("is_logged_in") === "true") {
        if(uName) {
            showApp();
        } else {
            localStorage.removeItem("is_logged_in");
            location.reload();
        }
    }
</script>
</body>
</html>
