<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login 2026</title>
    <style>
        body {
            background-color: #121212;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border: 2px solid #0f0;
            border-radius: 10px;
            box-shadow: 0 0 15px #0f0;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #0f0;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 90%;
            padding: 10px;
            background: #0f0;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .info {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        #app-menu { display: none; }
        #errMsg { color: red; display: none; margin-top: 10px; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #0f0; width: 20px; height: 20px; -webkit-animation: spin 2s linear infinite; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- شاشة القفل -->
    <div id="lock-screen" class="container">
        <h2>🔐 تسجيل الدخول</h2>
        <p>مرحباً: <span id="dispName" style="color:white">...</span></p>
        
        <input type="password" id="pIn" placeholder="أدخل كود التفعيل">
        <br>
        <button id="loginBtn">
            <span id="btnTxt">دخول للنظام</span>
            <div id="ldr" class="loader"></div>
        </button>
        <div id="errMsg">⚠️ الكود غير صحيح!</div>

        <div class="info">
            <p>ID: <span id="dispID">جاري التحميل...</span></p>
            <p id="dispIP">IP: جاري الكشف...</p>
        </div>
    </div>

    <!-- شاشة التطبيق بعد الفتح -->
    <div id="app-menu" class="container">
        <h2>✅ تم الفتح بنجاح</h2>
        <p>مرحباً بك في لوحة التحكم</p>
        <hr>
        <button onclick="alert('زر تجريبي')">📂 الملفات</button>
        <br><br>
        <button onclick="logout()" style="background:red; color:white">تسجيل خروج</button>
    </div>

<script>
    // =========================================================
    // ⚙️ إعدادات البوت والجروب (تم التحديث للجروب العام)
    // =========================================================
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw"; 
    
    // 👇 ده الآيدي بتاع جروب System Admin اللي ظهر في بياناتك
    const CHAT_ID = "-1003886528114"; 

    // =========================================================
    // 1. نظام إجبار التسجيل (تحديث جذري)
    // =========================================================
    // تم تغيير المفتاح لإجبار الجميع على التسجيل من جديد
    const STORAGE_KEY_NAME = "sys_FORCE_REG_2026_REAL_NAME"; 
    const STORAGE_KEY_ID = "sys_device_id_fixed";   
    
    let uName = localStorage.getItem(STORAGE_KEY_NAME);
    let uID = localStorage.getItem(STORAGE_KEY_ID);
    let userIP = "Unknown";

    // لو الجهاز ملوش ID، نعمل واحد جديد
    if(!uID) {
        uID = "ID-" + Math.floor(Math.random() * 89999 + 10000);
        localStorage.setItem(STORAGE_KEY_ID, uID);
    }
    document.getElementById("dispID").innerText = uID;

    // دالة إجبار الاسم
    function forceIdentify() {
        if(!uName || uName.trim().length < 3) {
            let tempName = "";
            // حلقة تكرارية: مش هيسيبه غير لما يكتب
            while(!tempName || tempName.trim().length < 3) {
                tempName = prompt("🛑 تنبيه أمني إجباري:\n\nيجب تسجيل اسمك الحقيقي بالكامل للاستمرار:\n(سيتم إرسال البيانات للإدارة)");
            }
            uName = tempName;
            localStorage.setItem(STORAGE_KEY_NAME, uName);
            
            // تحديث العرض
            document.getElementById("dispName").innerText = uName;

            // ✅ الإرسال الفوري لتيليجرام (تسجيل جديد)
            getIPAndSendToTelegram("🆕 تسجيل مستخدم جديد (إجباري)", `الاسم: ${uName}\nالآيدي: ${uID}`);
        } else {
            document.getElementById("dispName").innerText = uName;
            // حتى لو مسجل قبل كدة، نحدث الـ IP في الخلفية
            getIPAndSendToTelegram("♻️ فتح التطبيق", `المستخدم: ${uName}`);
        }
    }

    // =========================================================
    // 2. نظام الإرسال لتيليجرام
    // =========================================================
    function getIPAndSendToTelegram(title, details) {
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                userIP = data.ip;
                document.getElementById("dispIP").innerText = "IP: " + userIP;
                sendTelegramMsg(title, details, userIP);
            })
            .catch(err => {
                userIP = "Hidden/Error";
                document.getElementById("dispIP").innerText = "IP: غير متاح";
                sendTelegramMsg(title, details, userIP);
            });
    }

    function sendTelegramMsg(title, details, ip) {
        const messageText = `
🚨 *System Notification*
━━━━━━━━━━━━━━
👤 *Name:* ${uName}
🆔 *ID:* \`${uID}\`
🌐 *IP:* \`${ip}\`
━━━━━━━━━━━━━━
📝 *Action:* ${title}
ℹ️ *Info:* ${details}
        `;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(messageText)}&parse_mode=Markdown`;

        fetch(url)
            .then(response => console.log("Sent to Telegram"))
            .catch(error => console.error("Error sending to Telegram:", error));
    }

    // =========================================================
    // 3. تشغيل النظام
    // =========================================================
    
    // تشغيل طلب الاسم فوراً عند فتح الصفحة
    setTimeout(forceIdentify, 500);

    // =========================================================
    // 4. تسجيل الدخول (كلمة السر)
    // =========================================================
    const passList = ["QWRtaW5fMjZfMjkxMTk5Ng==","QWRtaW5fMjZfNzYxOTg3","QWRtaW5fMjZfNDExMjAxNA==","QWRtaW5fMjZfMjA3MjAxNw==","QWRtaW5fMjZfNzYyMDIx"];
    const SALT = "Admin_26_";

    function getCorrectPass() {
        const d = new Date(), y = d.getFullYear() < 2026 ? 2026 : d.getFullYear();
        let i = (y - 2026) * 2;
        if (d.getMonth() >= 5) i += 1; 
        return passList[i % 5];
    }

    document.getElementById("loginBtn").onclick = function() {
        const inp = document.getElementById("pIn");
        const val = inp.value.trim();
        const btn = document.getElementById("loginBtn");
        const txt = document.getElementById("btnTxt");
        const ldr = document.getElementById("ldr");
        const err = document.getElementById("errMsg");

        if(val.length < 1) return;

        btn.disabled = true;
        txt.style.display = "none";
        ldr.style.display = "block";
        err.style.display = "none";

        // تشفير مبسط للمقارنة
        const enVal = val.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)); // تحويل الأرقام العربية
        const inputHash = btoa(SALT + enVal);
        const correctHash = getCorrectPass();

        setTimeout(() => {
            if(inputHash === correctHash) {
                // إرسال تنبيه دخول ناجح
                sendTelegramMsg("✅ دخول ناجح", "تم فتح النظام بكلمة المرور", userIP);
                localStorage.setItem("is_logged_in_v80", "true");
                showApp();
            } else {
                // إرسال تنبيه محاولة فاشلة
                sendTelegramMsg("⛔ محاولة دخول فاشلة", `كتب كود غلط: ${enVal}`, userIP);
                btn.disabled = false;
                txt.style.display = "block";
                ldr.style.display = "none";
                err.style.display = "block";
                inp.value = "";
            }
        }, 1500);
    };

    function showApp() {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-menu").style.display = "block";
    }

    window.logout = () => {
        if(confirm("تأكيد الخروج؟")) {
            localStorage.removeItem("is_logged_in_v80");
            location.reload();
        }
    };

    // التحقق من تسجيل الدخول السابق
    if(localStorage.getItem("is_logged_in_v80") === "true") {
        showApp();
    }

</script>
</body>
</html>
