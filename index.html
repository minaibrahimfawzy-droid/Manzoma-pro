<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin V85</title>
    <style>
        body { background-color: #0f0f0f; color: #00ff00; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; }
        .container { border: 2px solid #00ff00; padding: 15px; border-radius: 10px; max-width: 400px; margin: 0 auto; background: #1a1a1a; }
        input, button { width: 90%; padding: 10px; margin: 10px 0; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #333; color: white; text-align: center; }
        button { background: #00ff00; color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: gray; cursor: not-allowed; }
        .status { margin-top: 10px; font-size: 14px; color: yellow; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 النظام الإداري Mangoma</h2>
        
        <!-- قسم التسجيل -->
        <div id="regSection">
            <p>🔴 مطلوب: تسجيل الاسم الحقيقي لفتح البرنامج</p>
            <input type="text" id="myName" placeholder="اكتب اسمك ثلاثي هنا...">
            <button onclick="handleRegister()" id="regBtn">تسجيل ودخول</button>
            <p class="status" id="statusMsg">جاري الاتصال بالسيرفر...</p>
        </div>

        <!-- قسم التطبيق -->
        <div id="appSection" style="display:none;">
            <h3>✅ تم الدخول بنجاح</h3>
            <p>الاسم: <span id="dispName" style="color:white"></span></p>
            <p>ID: <span id="dispID"></span></p>
            <p>IP: <span id="dispIP" style="font-size:12px; color:gray;"></span></p>
            <hr>
            <input type="password" id="pass" placeholder="كود الدخول">
            <button onclick="login()">فتح القفل</button>
        </div>
    </div>

<script>
    // ============================================
    // إعدادات البوت والجروب (تم وضع بياناتك هنا)
    // ============================================
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";
    
    // مفاتيح التخزين
    const KEY_NAME = "USER_NAME_V85";
    const KEY_ID = "DEVICE_ID_V85";

    // 1. توليد أو جلب الآيدي
    let devID = localStorage.getItem(KEY_ID);
    if (!devID) {
        devID = "ID-" + Math.floor(Math.random() * 900000 + 100000);
        localStorage.setItem(KEY_ID, devID);
    }

    // 2. التحقق من المستخدم القديم عند فتح البرنامج
    let savedName = localStorage.getItem(KEY_NAME);
    if (savedName && savedName.length > 2) {
        // مستخدم قديم - نظهر شاشة الدخول مباشرة ونبعت تنبيه في الخلفية
        showAppScreen(savedName);
        fetchIPAndSend(savedName, "♻️ <b>مستخدم عائد (فتح التطبيق)</b>");
    }

    // 3. دالة زر التسجيل
    function handleRegister() {
        const nameVal = document.getElementById("myName").value;
        if (nameVal.length < 3) {
            alert("يرجى كتابة الاسم بشكل صحيح");
            return;
        }

        const btn = document.getElementById("regBtn");
        const status = document.getElementById("statusMsg");
        
        btn.disabled = true;
        btn.innerText = "جاري التحقق...";
        status.style.display = "block";
        status.innerText = "جاري سحب الـ IP وإرسال البيانات...";

        // حفظ الاسم
        localStorage.setItem(KEY_NAME, nameVal);

        // بدء عملية الإرسال
        fetchIPAndSend(nameVal, "🆕 <b>تسجيل دخول جديد</b>", true);
    }

    // 4. الدالة الرئيسية: جلب IP ثم الإرسال لتليجرام
    function fetchIPAndSend(uName, actionType, isNewRegistration = false) {
        // أولاً: نجيب الـ IP من خدمة خارجية
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const userIP = data.ip;
                
                // تحديث الواجهة بالـ IP
                if(document.getElementById("dispIP")) {
                    document.getElementById("dispIP").innerText = userIP;
                }

                // ثانياً: نبعت لتليجرام
                sendToTelegram(uName, userIP, actionType, isNewRegistration);
            })
            .catch(error => {
                console.error("Error fetching IP:", error);
                // لو فشل سحب الاي بي، نبعت بدونه
                sendToTelegram(uName, "غير معروف", actionType, isNewRegistration);
            });
    }

    // 5. الإرسال الفعلي لتليجرام
    function sendToTelegram(name, ip, action, isNewRegistration) {
        const messageText = `
🚨 <b>تقرير دخول النظام</b>
━━━━━━━━━━━━
👤 <b>الاسم:</b> ${name}
🆔 <b>ID:</b> <code>${devID}</code>
🌐 <b>IP:</b> <code>${ip}</code>
📝 <b>الحالة:</b> ${action}
━━━━━━━━━━━━
        `;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: messageText,
                parse_mode: 'HTML'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                if (isNewRegistration) {
                    document.getElementById("statusMsg").innerText = "✅ تم الإرسال بنجاح!";
                    setTimeout(() => {
                        showAppScreen(name);
                    }, 1000);
                }
            } else {
                alert("حدث خطأ في البوت: " + data.description);
                document.getElementById("regBtn").disabled = false;
            }
        })
        .catch(err => {
            alert("فشل الاتصال بتليجرام. تأكد من الإنترنت.");
            document.getElementById("regBtn").disabled = false;
        });
    }

    // 6. عرض شاشة التطبيق
    function showAppScreen(name) {
        document.getElementById("regSection").style.display = "none";
        document.getElementById("appSection").style.display = "block";
        document.getElementById("dispName").innerText = name;
        document.getElementById("dispID").innerText = devID;
    }

    // 7. زر فتح القفل (داخلي)
    function login() {
        const p = document.getElementById("pass").value;
        const n = document.getElementById("dispName").innerText;
        const ip = document.getElementById("dispIP").innerText || "Unknown";
        
        if(p.length > 0) {
            // نبعت محاولة الدخول دي كمان
            sendToTelegram(n, ip, "🔐 محاولة فك تشفير بكود: " + p, false);
            alert("تم إرسال الكود للتحقق");
        }
    }

</script>
</body>
                                                                         </html>
