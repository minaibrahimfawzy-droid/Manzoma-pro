<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin V80</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; text-align: center; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 20px; margin: 0 auto; max-width: 400px; border-radius: 10px; }
        input, button { width: 90%; padding: 10px; margin: 5px 0; font-size: 16px; }
        button { background: #0f0; color: #000; border: none; font-weight: bold; cursor: pointer; }
        #debug-console { 
            background: #111; color: #fff; text-align: left; direction: ltr; 
            padding: 10px; margin-top: 20px; border: 1px solid #555; 
            font-size: 11px; height: 100px; overflow-y: scroll; 
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>🔒 تسجيل الدخول V80</h2>
        <p>الاسم: <span id="uNameDisplay">...</span></p>
        <button onclick="forceSendTelegram()">📡 اضغط هنا لاختبار الاتصال</button>
        <hr>
        <input type="password" id="passInput" placeholder="كود الدخول">
        <button onclick="checkPass()">دخول</button>
    </div>

    <!-- شاشة كشف الأخطاء (عشان نعرف المشكلة فين) -->
    <div id="debug-console">System Ready... Waiting for action.</div>

<script>
    // ============================================
    // بياناتك (تأكدنا منها من رسائلك السابقة)
    // ============================================
    const TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";

    // دالة الكتابة في شاشة الأخطاء
    function log(msg) {
        const c = document.getElementById("debug-console");
        const time = new Date().toLocaleTimeString();
        c.innerHTML += `<div>[${time}] ${msg}</div>`;
        c.scrollTop = c.scrollHeight;
    }

    // 1. نظام الاسم الإجباري
    let uName = localStorage.getItem("REAL_NAME_V80");
    let uID = localStorage.getItem("DEVICE_ID_V80");

    if (!uID) {
        uID = "ID-" + Math.floor(Math.random() * 999999);
        localStorage.setItem("DEVICE_ID_V80", uID);
    }

    function askName() {
        if (!uName || uName.length < 3) {
            uName = prompt("اكتب اسمك الحقيقي بالكامل (إجباري):");
            if (uName && uName.length > 2) {
                localStorage.setItem("REAL_NAME_V80", uName);
                document.getElementById("uNameDisplay").innerText = uName;
                forceSendTelegram("تسجيل جديد"); // إرسال فوري
            } else {
                askName(); // تكرار الطلب
            }
        } else {
            document.getElementById("uNameDisplay").innerText = uName;
            forceSendTelegram("فتح التطبيق"); // إرسال فوري
        }
    }

    // 2. دالة الإرسال (قلب النظام)
    function forceSendTelegram(actionType = "اختبار يدوي") {
        log("⏳ جاري محاولة الإتصال بتليجرام...");
        
        const text = `
⚠️ *تنبيه النظام V80*
👤 الاسم: ${uName}
🆔 الآيدي: \`${uID}\`
📝 الحدث: ${actionType}
        `;

        const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

        // المحاولة الأولى: Fetch العادي
        fetch(url)
        .then(response => {
            log(`Status Code: ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.ok) {
                log("✅ تم الإرسال بنجاح! (Success)");
                alert("تم الاتصال بالسيرفر بنجاح!");
            } else {
                log("❌ التليجرام رفض الرسالة: " + data.description);
                alert("خطأ من تليجرام: " + data.description);
            }
        })
        .catch(error => {
            log("🚫 فشل الاتصال بالإنترنت أو حظر: " + error.message);
            // حل بديل: لو الـ Fetch فشل، نجرب طريقة تانية (Image Pixel)
            // دي طريقة قديمة بس بتعدي من الحظر ساعات
            new Image().src = url; 
            log("⚠️ تم استخدام الطريقة البديلة (Image Pixel)");
        });
    }

    // 3. التحقق من الباسورد
    function checkPass() {
        // ... (نفس كود الباسورد بتاعك)
        const p = document.getElementById("passInput").value;
        if(p.length > 0) {
            log("جاري التحقق من الباسورد...");
            // هنا ممكن تضيف منطق الباسورد
        }
    }

    // تشغيل عند البدء
    setTimeout(askName, 500);

</script>
</body>
</html>
