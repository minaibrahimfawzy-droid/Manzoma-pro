<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manzoma Activation</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: sans-serif; text-align: center; padding: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center; }
        button { width: 100%; padding: 12px; background: #0f0; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="mainBox">
        <h2>🔐 تفعيل المنظومة 2026</h2>
        <p>سجل اسمك لفتح التطبيق</p>
        <input type="text" id="username" placeholder="اكتب اسمك هنا...">
        <button onclick="sendData()" id="btn">تفعيل ودخول</button>
        <p id="status" style="color:yellow; margin-top:10px;"></p>
    </div>

<script>
    // بيانات البوت والجروب بتوعك
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114";

    function sendData() {
        const name = document.getElementById("username").value;
        const btn = document.getElementById("btn");
        const status = document.getElementById("status");

        if (name.length < 3) {
            alert("اكتب الاسم بشكل صحيح");
            return;
        }

        btn.disabled = true;
        btn.innerText = "جاري التفعيل...";
        status.innerText = "جاري الاتصال بالسيرفر...";

        // 1. نجيب الـ IP
        fetch("https://api.ipify.org?format=json")
        .then(res => res.json())
        .then(data => {
            sendMessage(name, data.ip);
        })
        .catch(err => {
            sendMessage(name, "IP غير معروف");
        });
    }

    function sendMessage(name, ip) {
        // تجهيز الرسالة
        const text = `🚀 *تفعيل جديد (Manzoma)*\n👤 الاسم: ${name}\n🌐 IP: ${ip}`;
        
        // رابط الإرسال المباشر
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

        // تنفيذ الإرسال
        fetch(url).then(response => {
            status.innerText = "✅ تم التفعيل بنجاح!";
            alert("تم إرسال البيانات بنجاح! سيفتح التطبيق الآن.");
            // هنا ممكن تضيف كود يفتح الشاشة التالية
        }).catch(error => {
            status.innerText = "تم الإرسال (Offline Mode)";
        });
    }
</script>

</body>
</html>
