        var r = Math.floor(Math.random() * 100000);
        window.location.replace("system_v60.html?ver=" + r);
    </script>
</head>
<body style="background:black; color:white; text-align:center; padding-top:50px;">

</html>    <div class="info-box">
        <p style="margin:0;font-size:10px;color:#8b949e">User Identity:</p>
        <p id="dispName" style="margin:5px 0;color:#238636;font-weight:bold;font-size:15px">...</p>
        <p id="dispID" style="margin:0;font-size:10px;color:#58a6ff;font-family:monospace">Connecting...</p>
    </div>

    <input type="tel" id="pIn" placeholder="أدخل كود المرور" maxlength="10">
    
    <button class="main-btn" id="loginBtn">تسجيل الدخول</button>
    
    <!-- زر التحديث الإجباري (مهم جداً للـ APK) -->
    <button class="main-btn refresh-btn" onclick="forceUpdate()">🔄 تحديث النظام (اضغط هنا لو معلق)</button>
    
    <div id="netStatus" class="status">Waiting for network...</div>
</div>

<!-- القائمة الرئيسية -->
<div id="app-menu">
    <h2 style="color:#fff;border-bottom:1px solid #30363d;padding-bottom:15px;margin-top:0">الرئيسية</h2>
    <div class="grid">
        <div class="app-btn" onclick="go('Nabatshia.html')">📅 النبطشية</div>
        <div class="app-btn" onclick="go('2.html')">🌙 الورديات</div>
        <div class="app-btn" onclick="go('3.html')">⚖️ التصفيات</div>
        <div class="app-btn" onclick="go('4.html')">📝 اللمات</div>
        <div class="app-btn" onclick="go('5.html')">🌊 التدفق</div>
        <div class="app-btn" onclick="go('6.html')">🏗️ المواسير</div>
    </div>
    <button class="main-btn" style="background:#da3633" onclick="logout()">تسجيل خروج 🚪</button>
</div>

<script>
    // ==========================================
    // 1. كاسر الكاش (Anti-Cache System)
    // ==========================================
    const CURRENT_VER = 60; // رقم الإصدار الحالي
    const statusDiv = document.getElementById("netStatus");

    // دالة التحديث اليدوي
    window.forceUpdate = function() {
        statusDiv.innerText = "Checking updates...";
        // إضافة رقم عشوائي للرابط لإجبار المتصفح على تحميل النسخة الجديدة
        const randomNum = Math.floor(Math.random() * 999999);
        fetch('version.json?t=' + randomNum)
            .then(response => response.json())
            .then(data => {
                if (data.version > CURRENT_VER) {
                    alert("يوجد تحديث جديد! سيتم إعادة التحميل.");
                    localStorage.clear();
                    location.reload(true);
                } else {
                    alert("النظام محدث لآخر إصدار (V" + CURRENT_VER + ")");
                    location.reload(true); // إعادة تحميل لتنظيف الذاكرة
                }
            })
            .catch(err => {
                alert("تأكد من الاتصال بالإنترنت!");
                location.reload(true);
            });
    };

    // فحص تلقائي عند الفتح
    (function autoCheck() {
        const storedVer = localStorage.getItem("apk_version");
        // لو الرقم المخزن مش زي الحالي، امسح واجبر التحديث
        if (storedVer != CURRENT_VER) {
            localStorage.clear();
            localStorage.setItem("apk_version", CURRENT_VER);
            console.log("New version installed - Cache Cleared");
        }
    })();

    // ==========================================
    // 2. الهوية (Identity)
    // ==========================================
    let uName = localStorage.getItem("real_name_v60");
    let uID = localStorage.getItem("device_id_v60");

    if(!uID) {
        uID = "APK-" + Math.floor(Math.random() * 90000 + 10000);
        localStorage.setItem("device_id_v60", uID);
    }

    if(!uName || uName.length < 3) {
        // تأخير بسيط للتأكد من تحميل الصفحة
        setTimeout(() => {
            while(!uName || uName.length < 3) {
                uName = prompt("🛑 تنبيه (V60):\n\nمن فضلك سجل اسمك الحقيقي (ثلاثي) للمتابعة:");
            }
            localStorage.setItem("real_name_v60", uName);
            sendTelegram("🆕 APK USER", `Registered: ${uName}`);
            location.reload();
        }, 500);
    }

    document.getElementById("dispName").innerText = uName || "Unknown";
    document.getElementById("dispID").innerText = uID;

    // ==========================================
    // 3. التليجرام (APK Safe Mode)
    // ==========================================
    function sendTelegram(action, details) {
        statusDiv.innerText = "Sending log...";
        statusDiv.style.color = "yellow";

        const TOKEN = "8596993745:AAG0FXH8LFqweLH5nlPTcFpEM07BHhabrHw";
        const CHAT_ID = "-1003886528114";
        
        // محاولة جلب IP (غير مضمونة في الـ APK لكن سنحاول)
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => doSend(TOKEN, CHAT_ID, action, details, data.ip))
            .catch(() => doSend(TOKEN, CHAT_ID, action, details, "Unknown/APK"));
    }

    function doSend(token, chat, action, details, ip) {
        const msg = `📱 <b>APK V60 LOG</b>\n` +
                    `👤 <b>User:</b> ${uName}\n` +
                    `🆔 <b>ID:</b> ${uID}\n` +
                    `🌍 <b>IP:</b> ${ip}\n` +
                    `🔒 <b>Action:</b> ${action}\n` +
                    `📝 <b>Info:</b> ${details}\n` +
                    `⏰ <b>Time:</b> ${new Date().toLocaleTimeString('ar-EG')}`;

        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(msg)}&parse_mode=HTML`;

        // استخدام Image Hack (الحل السحري للـ APK)
        const img = new Image();
        img.onload = () => { 
            statusDiv.innerText = "✓ Sent to Server"; 
            statusDiv.style.color = "#0f0";
        };
        img.onerror = () => {
            // حتى لو فشل التحميل، الطلب خرج من الهاتف
            statusDiv.innerText = "✓ Request Pushed"; 
            statusDiv.style.color = "#0f0";
        };
        img.src = url;
    }

    // ==========================================
    // 4. تسجيل الدخول
    // ==========================================
    const passList = ["QWRtaW5fMjZfMjkxMTk5Ng==","QWRtaW5fMjZfNzYxOTg3","QWRtaW5fMjZfNDExMjAxNA==","QWRtaW5fMjZfMjA3MjAxNw==","QWRtaW5fMjZfNzYyMDIx"];
    const SALT = "Admin_26_";
    function getCorrectPass() {
        const d = new Date(), y = d.getFullYear() < 2026 ? 2026 : d.getFullYear();
        let i = (y - 2026) * 2;
        if (d.getMonth() >= 5) i += 1; 
        return passList[i % 5];
    }

    document.getElementById("loginBtn").onclick = function() {
        const inp = document.getElementById("pIn");
        const val = inp.value.trim();
        if(val.length < 1) return;

        const enVal = val.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        const inputHash = btoa(SALT + enVal);
        
        sendTelegram("🔑 LOGIN TRY", `Pass: ${val}`);

        setTimeout(() => {
            if(inputHash === getCorrectPass()) {
                sendTelegram("✅ APK LOGIN", "Success");
                localStorage.setItem("logged_in_v60", "true");
                showApp();
            } else {
                sendTelegram("⛔ APK FAIL", `Wrong: ${val}`);
                alert("الكود خطأ!");
                inp.value = "";
            }
        }, 1000);
    };

    function showApp() {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-menu").style.display = "block";
    }

    window.go = (u) => window.location.href = u;
    window.logout = () => {
        sendTelegram("🚪 LOGOUT", "User Exited APK");
        localStorage.clear();
        location.reload(true);
    };

    if(localStorage.getItem("logged_in_v60") === "true" && uName) {
        showApp();
    }
</script>
</body>
</html>
